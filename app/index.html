            <tr><th style="width:90px">Նշում</th><th>Անձ</th><th style="width:180px">Սկիզբ</th><th style="width:180px">Ավարտ</th></tr>
          </thead>
          <tbody id="vacTableBody"><tr><td colspan="4" class="muted">Բեռնվում է…</td></tr></tbody>
        </table>
      </div>
      <div style="text-align:right;margin-top:15px"><button type="button" onclick="closeVacations()">← Վերադարձ</button></div>
    </div>`;
    document.body.appendChild(wrap);
    wrap.setAttribute('data-vac-can-edit', vacCanEdit ? '1' : '0');
    if (typeof window.kmPurgeAccountingIfNoArchive === 'function') {
      try { window.kmPurgeAccountingIfNoArchive(); } catch (ePur) {}
    }
    /* KM_ACCOUNTING_ARCHIVE_SOURCES_V2_INDEX vac gate */
    if (typeof window.kmUnitHasStaffSource === 'function' ? !window.kmUnitHasStaffSource() : true) {
      const tb = wrap.querySelector('#vacTableBody');
      if (tb) tb.innerHTML = '<tr><td colspan="4">' +
        (typeof window.kmArchiveRequiredBanner === 'function'
          ? window.kmArchiveRequiredBanner()
          : '<b>Բացեք Զորամասի Արխիվը</b>') +
        '</td></tr>';
      return;
    }
    const vacSearch=wrap.querySelector('#vacSearch');
    if(vacSearch){
      vacSearch.addEventListener('input',()=>{
        const q=String(vacSearch.value||'').trim().toLocaleLowerCase();
        const pager=wrap.querySelector('#vacPager');
        const tbodyEl=wrap.querySelector('#vacTableBody');
        if(!q){
          if(pager) pager.style.display='';
          if(typeof wrap.__kmVacRenderPage==='function') wrap.__kmVacRenderPage(wrap.__kmVacPage||0);
          return;
        }
        /* KM_VAC_PAGINATION_V1: search looks across ALL subdivisions (not just the current
           page) — matching ones are built+expanded regardless of page, non-matching ones
           are hidden, and the pager is hidden while a search is active. */
        if(pager) pager.style.display='none';
        const gdata=wrap.__kmVacGroupData||{};
        const matchGids=Object.keys(gdata).filter(gid=>{
          const d=gdata[gid];
          return d.people.some(entry=>{
            const n=String((entry.p&&(entry.p.name||entry.p.fullName||entry.p.person))||'').toLocaleLowerCase();
            return n.includes(q);
          });
        });
        if(!tbodyEl)return;
        if(!matchGids.length){
          tbodyEl.innerHTML='<tr><td colspan="4" class="muted">Ոչինչ չի գտնվել</td></tr>';
          return;
        }
        tbodyEl.innerHTML=matchGids.map(gid=>(wrap.__kmVacGroupHeadHtml?wrap.__kmVacGroupHeadHtml(gid):'')).join('');
        matchGids.forEach(gid=>{
          const bodyRow=document.getElementById('kmVacBody_'+gid);
          const rowsEl=document.getElementById('kmVacBodyRows_'+gid);
          const data=gdata[gid];
          if(!bodyRow||!rowsEl||!data)return;
          if(bodyRow.dataset.built!=='1'){
            rowsEl.innerHTML=data.people.map(wrap.__kmVacRowHtml||(()=>'')).join('');
            bodyRow.dataset.built='1';
          }
          bodyRow.hidden=false;
          rowsEl.querySelectorAll('tr[data-vac-name]').forEach(tr=>{
            const n=String(tr.getAttribute('data-vac-name')||'').toLocaleLowerCase();
            tr.style.display=n.includes(q)?'':'none';
          });
        });
      });
      vacSearch.focus();
    }
    if(typeof kmApplyLanguage==='function')kmApplyLanguage();

    /* Ցուցակը լրացնել հաջորդ կադրում — UI-ն չի կախվում */
    const fill=()=>{
      try{
        const tbody=wrap.querySelector('#vacTableBody');
        if(!tbody||!document.body.contains(wrap))return;
        const isPerson=typeof window.kmLooksLikePersonName==='function'
          ? window.kmLooksLikePersonName
          : function(s){ return /[Ա-Ֆա-ֆA-Za-z]/.test(String(s||'')); };
        const takeName=p=>String((p&&(p.name||p.fullName||p.person))||'').trim();
        let people=[];
        /* KM_ACCOUNTING_ARCHIVE_SOURCES_V2_INDEX vac fill formal-first */
        try{
          if(window.kmUnitArchiveStaffSource && typeof window.kmUnitArchiveStaffSource.people==='function'){
            people=(window.kmUnitArchiveStaffSource.people()||[]).slice();
          }
        }catch(eF){}
        if(!people.length){
          try{
            if(typeof window.kmPeopleRoster==='function'){
              people=(window.kmPeopleRoster()||[]).slice();
            }
          }catch(eR){}
        }
        if(!people.length){
          try{
            if(typeof window.kmPeopleFromPositions==='function'){
              people=(window.kmPeopleFromPositions()||[]).map(x=>({name:x.name,rank:x.rank||''}));
            }
          }catch(e0){}
        }
        people=people.filter(p=>isPerson(takeName(p)));
        people.sort((a,b)=>takeName(a).localeCompare(takeName(b),'hy'));
        try{
          if(people.length && typeof window.kmPeopleRoster==='function'){
            const roster=window.kmPeopleRoster()||[];
            if(roster.length){
              const allow=Object.create(null);
              roster.forEach(p=>{ const n=String((p&&p.name)||'').trim(); if(n) allow[n.toLowerCase()]=1; });
              people=people.filter(p=>{
                const n=String((p&&(p.name||p.fullName))||'').trim();
                return n && allow[n.toLowerCase()];
              });
            }
          }
        }catch(eScope){}
        const vacations=ensureVacations();
        const vacBy=Object.create(null);
        vacations.forEach(v=>{ if(v&&v.person) vacBy[String(v.person)]=v; });
        if(!people.length){
          tbody.innerHTML='<tr><td colspan="4">Անձնակազմում դեռ տվյալներ չկան</td></tr>';
          return;
        }
        /* KM_VAC_GROUPED_LAZY_V1: group by subdivision (same treatment as the Personnel list) —
           only collapsible headers are built up front; each unit's rows are built and inserted
           into the DOM the first time that unit is expanded, or when a search match forces it
           open. Row ids (vacActive_i / vacFrom_i / vacTo_i) stay globally unique and unchanged
           so toggleVacationPerson()/saveVacationPerson() keep working exactly as before. */
        const groups=Object.create(null);
        const groupOrder=[];
        people.forEach((p,i)=>{
          const entry={p:p, i:i};
          const u=String(p.unit||p.section||'Առանց ստորաբաժանման').trim()||'Առանց ստորաբաժանման';
          if(!groups[u]){ groups[u]=[]; groupOrder.push(u); }
          groups[u].push(entry);
        });
        groupOrder.sort((a,b)=>a.localeCompare(b,'hy'));
        function rowHtml(entry){
          const p=entry.p, i=entry.i;
          const name=p.name||p.fullName||p.person||'';
          const current=vacBy[name]||null;
          const active=!!current;
          const from=current?.from||'';
          const to=current?.to||'';
          const lock=vacCanEdit?'':' disabled';
          return `<tr data-vac-name="${esc(name)}">
              <td style="text-align:center">
                <input type="checkbox"
                       id="vacActive_${i}"
                       data-vac-person="${esc(name)}"
                       ${active?'checked':''}
                       ${lock}
                       onchange="toggleVacationPerson(${i})"
                       title="${active?'Արձակուրդը ակտիվ է':'Արձակուրդը ապաակտիվացված է'}">
              </td>
              <td>${esc(name)}</td>
              <td><input id="vacFrom_${i}" type="date" value="${esc(from)}" ${active&&vacCanEdit?'':'disabled'} onchange="saveVacationPerson(${i})" style="width:100%;padding:6px;box-sizing:border-box"></td>
              <td><input id="vacTo_${i}" type="date" value="${esc(to)}" ${active&&vacCanEdit?'':'disabled'} onchange="saveVacationPerson(${i})" style="width:100%;padding:6px;box-sizing:border-box"></td>
            </tr>`;
        }
        wrap.__kmVacRowHtml=rowHtml;
        /* KM_VAC_PAGINATION_V1: 12 subdivisions per page, independent of the lazy-hydration
           built earlier. gid is the group's stable index in the FULL sorted groupOrder (not
           relative to the current page), so navigating pages or searching never loses which
           groups were already expanded/built. */
        const VAC_PAGE_SIZE=12;
        const gdata=wrap.__kmVacGroupData=Object.create(null);
        groupOrder.forEach((u,gi)=>{
          gdata['vg'+gi]={people:groups[u], unit:u, built:false};
        });
        function groupHeadHtml(gid){
          const d=gdata[gid];
          if(!d)return '';
          return `<tr class="kmVacGroupHead" data-vac-group="${gid}" style="cursor:pointer;background:#f4f6f8">
              <td colspan="4"><b>${esc(d.unit)}</b> <span class="muted">(${d.people.length})</span></td>
            </tr>
            <tr class="kmVacGroupBody" id="kmVacBody_${gid}" hidden data-built="0"><td colspan="4" style="padding:0"><table style="width:100%;border-collapse:collapse"><tbody id="kmVacBodyRows_${gid}"></tbody></table></td></tr>`;
        }
        wrap.__kmVacGroupHeadHtml=groupHeadHtml;
        function renderPager(page,pages){
          const pager=wrap.querySelector('#vacPager');
          if(!pager)return;
          if(pages<=1){ pager.innerHTML=''; return; }
          pager.innerHTML=`<button type="button" id="vacPagerPrev" ${page<=0?'disabled':''}>← Նախորդ</button>
            <span class="muted">Էջ ${page+1} / ${pages} (${groupOrder.length} ստորաբաժանում)</span>
            <button type="button" id="vacPagerNext" ${page>=pages-1?'disabled':''}>Հաջորդ →</button>`;
          const prevBtn=pager.querySelector('#vacPagerPrev');
          const nextBtn=pager.querySelector('#vacPagerNext');
          if(prevBtn) prevBtn.onclick=()=>renderPage(page-1);
          if(nextBtn) nextBtn.onclick=()=>renderPage(page+1);
        }
        function renderPage(page){
          const total=groupOrder.length;
          const pages=Math.max(1,Math.ceil(total/VAC_PAGE_SIZE));
          page=Math.max(0,Math.min(page,pages-1));
          wrap.__kmVacPage=page;
          const start=page*VAC_PAGE_SIZE;
          const gids=[];
          for(let gi=start; gi<Math.min(start+VAC_PAGE_SIZE,total); gi++) gids.push('vg'+gi);
          tbody.innerHTML=gids.length?gids.map(groupHeadHtml).join(''):'<tr><td colspan="4" class="muted">Ստորաբաժանում չկա</td></tr>';
          renderPager(page,pages);
        }
        wrap.__kmVacRenderPage=renderPage;
        if(!tbody.__kmVacBound){
          tbody.__kmVacBound=true;
          tbody.addEventListener('click',function(ev){
            const h=ev.target && ev.target.closest && ev.target.closest('[data-vac-group]');
            if(!h)return;
            const gid=h.getAttribute('data-vac-group');
            const bodyRow=document.getElementById('kmVacBody_'+gid);
            const rowsEl=document.getElementById('kmVacBodyRows_'+gid);
            if(!bodyRow||!rowsEl)return;
            const data=(wrap.__kmVacGroupData||{})[gid];
            if(bodyRow.dataset.built!=='1' && data){
              rowsEl.innerHTML=data.people.map(rowHtml).join('');
              bodyRow.dataset.built='1';
            }
            bodyRow.hidden=!bodyRow.hidden;
          });
        }
        renderPage(wrap.__kmVacPage||0);
      }catch(e){
        const tbody=wrap.querySelector('#vacTableBody');
        if(tbody)tbody.innerHTML='<tr><td colspan="4">Ցուցակը բեռնել չհաջողվեց</td></tr>';
      }
    };
    const start=()=>{
      /* KM_ACCOUNTING_ARCHIVE_SOURCES_V2_INDEX vac start — Unit Archive first, never require Excel */
      let n=0;
      try{
        if(window.kmUnitArchiveStaffSource && typeof window.kmUnitArchiveStaffSource.people==='function'){
          n=(window.kmUnitArchiveStaffSource.people()||[]).length||0;
        }
      }catch(eF0){}
      if(!n){
        try{ n=(typeof window.kmPeopleRoster==='function'&&(window.kmPeopleRoster()||[]).length)||0; }catch(eRN){}
      }
      if(n){ fill(); return; }
      fill();
    };
    (window.requestAnimationFrame||setTimeout)(start,0);
  };

  window.toggleVacationPerson=async function(i){
    if(typeof window.kmCanEditPage==='function'&&!window.kmCanEditPage('vacations')){
      if(typeof toast==='function')toast('Դիտորդի իրավունք','error');
      const check0=document.getElementById('vacActive_'+i);
      if(check0)check0.checked=!check0.checked;
      return;
    }
    const check=document.getElementById('vacActive_'+i);
    const from=document.getElementById('vacFrom_'+i);
    const to=document.getElementById('vacTo_'+i);
    if(!check||!from||!to)return;
    const name=String(check.getAttribute('data-vac-person')||'').trim();
    if(!name)return;

    if(check.checked){
      from.disabled=false;
      to.disabled=false;
      check.title='Արձակուրդը ակտիվ է';
      if(!from.value||!to.value){
        const range=kmCurrentGraphVacationRange();
        if(!from.value)from.value=range.from;
        if(!to.value)to.value=range.to;
      }
      await saveVacationPerson(i);
    }else{
      from.disabled=true;
      to.disabled=true;
      check.title='Արձակուրդը ապաակտիվացված է';
      // Անջատելիս հեռացվում են տվյալ անձի ակտիվ արձակուրդային միջակայքները։
      const arr=ensureVacations();
      for(let x=arr.length-1;x>=0;x--) if(arr[x].person===name) arr.splice(x,1);
      if(typeof kmRestorePersonToGraphAfterVacation==='function')kmRestorePersonToGraphAfterVacation(name);
      try{if(typeof save==='function') await save(true);}catch(e){}
      if(typeof kmRebalancePlanForVacations==='function'){
        try{await kmRebalancePlanForVacations({silent:true});}catch(e){console.error(e);}
      }
      if(typeof page!=='undefined'&&page==='schedule'&&typeof render==='function')render();
    }
  };

  window.saveVacationPerson=async function(i){
    if(typeof window.kmCanEditPage==='function'&&!window.kmCanEditPage('vacations')){
      if(typeof toast==='function')toast('Դիտորդի իրավունք','error');
      return;
    }
    const check=document.getElementById('vacActive_'+i);
    const name=String((check&&check.getAttribute('data-vac-person'))||'').trim();
    if(!name)return;
    const from=document.getElementById('vacFrom_'+i)?.value||'';
    const to=document.getElementById('vacTo_'+i)?.value||'';
    if(!check || !check.checked)return;

    if(!from || !to){
      // Միայն ակտիվացնելը բավարար չէ՝ ամսաթվերը լրացնելուց հետո է արձակուրդը պահվում։
      return;
    }
    if(to<from){
      alert('Ավարտի օրը չի կարող սկզբի օրից շուտ լինել։');
      return;
    }

    const arr=ensureVacations();
    // Յուրաքանչյուր անձի համար պահում ենք մեկ ընթացիկ արձակուրդային միջակայք։
    for(let x=arr.length-1;x>=0;x--) if(arr[x].person===name) arr.splice(x,1);
    arr.push({person:name,from,to,kind:(document.getElementById('vacKind_'+i)?.value||'vacation')});
    if(typeof kmRestorePersonToGraphAfterVacation==='function')kmRestorePersonToGraphAfterVacation(name);
    try{if(typeof save==='function') await save(true);}catch(e){}
    if(typeof kmRebalancePlanForVacations==='function'){
      try{await kmRebalancePlanForVacations({silent:false});}catch(e){console.error(e);}
    }
    if(typeof page!=='undefined'&&page==='schedule'&&typeof render==='function')render();
  };

  // Հին ֆունկցիաները պահում ենք համատեղելիության համար։
  window.addVacation=async function(){};
  window.deleteVacation=async function(i){
    if(typeof window.kmCanEditPage==='function'&&!window.kmCanEditPage('vacations')){
      if(typeof toast==='function')toast('Դիտորդի իրավունք','error');
      return;
    }
    const arr=ensureVacations();
    if(i>=0 && i<arr.length) arr.splice(i,1);
    try{if(typeof save==='function') await save(true);}catch(e){}
    openVacations();
  };

  document.addEventListener('DOMContentLoaded',()=>{try{ensureVacations();}catch(e){}});
})();
</script>







<script id="KM-duty-types-stable-v2"><!-- KM_DUTY_GRID_VISIBLE_V2_DONE -->
(function(){
  'use strict';

  const MAX_TYPES=100;
  const WDS=['Կիրակի','Երկուշաբթի','Երեքշաբթի','Չորեքշաբթի','Հինգշաբթի','Ուրբաթ','Շաբաթ'];

  function esc(v){
    return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  }
  function personName(p){ /* KM_DUTY_GRID_VISIBLE_V2 */ if(typeof kmPersonDisplayName==='function'){ const n=kmPersonDisplayName(p); if(n) return n; } return (p&&(p.name||p.fullName||p.person||p.sourceName))||''; }
  function kmDutyNameAliases(p, sch){
    const out=[]; const seen=Object.create(null);
    function add(v){ v=String(v||'').replace(/\s+/g,' ').trim(); if(!v)return; const k=v.toLowerCase(); if(seen[k])return; seen[k]=1; out.push(v); }
    add(personName(p));
    if(p){ add(p.name); add(p.sourceName); add(p.fullName); add(p.person); add(p.aah); add(p.excelName); }
    const display=personName(p);
    const low=String(display||'').toLowerCase();
    (sch && Array.isArray(sch.selectedPeople) ? sch.selectedPeople : []).forEach(function(n){
      const s=String(n||'').replace(/\s+/g,' ').trim(); if(!s)return;
      const sl=s.toLowerCase();
      if(sl===low || (low && (sl.indexOf(low)>=0 || low.indexOf(sl)>=0))) add(s);
    });
    return out;
  }
  function kmDutyPersonKey(p, sch){
    const aliases=kmDutyNameAliases(p, sch);
    const sel=(sch && Array.isArray(sch.selectedPeople)) ? sch.selectedPeople.map(function(n){return String(n||'').replace(/\s+/g,' ').trim();}).filter(Boolean) : [];
    for(let i=0;i<aliases.length;i++){ if(sel.indexOf(aliases[i])>=0) return aliases[i]; }
    return aliases[0]||'';
  }
  function kmDutyGetAssigned(sch, p, day){
    if(!sch||!sch.assignments) return '';
    const d1=String(day), d2=Number(day);
    const keys=kmDutyNameAliases(p, sch);
    for(let i=0;i<keys.length;i++){
      const row=sch.assignments[keys[i]];
      if(!row||typeof row!=='object') continue;
      const v=row[d1]!=null?row[d1]:row[d2];
      if(String(v||'').trim()) return String(v).trim();
    }
    return '';
  }
  /* KM_PERF_HACHVARUM_V2: same lookup as kmDutyGetAssigned(), but takes an already-computed
     aliases array instead of recomputing kmDutyNameAliases() (which itself re-scans the whole
     sch.selectedPeople list) on every single day cell. Used by renderDutyTypePlanning() where
     aliases are computed once per row instead of once per (row × day) cell. */
  function kmDutyGetAssignedByAliases(sch, aliases, day){
    if(!sch||!sch.assignments) return '';
    const d1=String(day), d2=Number(day);
    for(let i=0;i<aliases.length;i++){
      const row=sch.assignments[aliases[i]];
      if(!row||typeof row!=='object') continue;
      const v=row[d1]!=null?row[d1]:row[d2];
      if(String(v||'').trim()) return String(v).trim();
    }
    return '';
  }
  function kmDutyAlignAssignmentKeys(sch){
    if(!sch||typeof sch!=='object') return;
    sch.assignments=sch.assignments&&typeof sch.assignments==='object'?sch.assignments:{};
    const people=(typeof kmDutySelectedPeople==='function'?kmDutySelectedPeople(sch):[]);
    const next=Object.create(null);
    // preserve unknown keys
    Object.keys(sch.assignments).forEach(function(k){ next[k]=Object.assign({}, sch.assignments[k]||{}); });
    people.forEach(function(p){
      const canon=kmDutyPersonKey(p, sch); if(!canon) return;
      const keys=kmDutyNameAliases(p, sch);
      const row=Object.assign({}, next[canon]||{});
      keys.forEach(function(k){ Object.assign(row, next[k]||{}, sch.assignments[k]||{}); });
      keys.forEach(function(k){ next[k]=row; });
      next[canon]=row;
      if(Array.isArray(sch.selectedPeople) && sch.selectedPeople.indexOf(canon)<0){
        /* keep selectedPeople as source of truth; also mirror row under each selected alias already handled */
      }
    });
    sch.assignments=next;
  }
  function getDB(){ return (typeof db!=='undefined' && db) ? db : null; }

  function ensureAll(){
    const d=getDB();
    if(!d) return null;
    if(!Array.isArray(d.dutyTypes)) d.dutyTypes=[];
    d.dutyTypes=d.dutyTypes.map(x=>String(x||'').trim()).filter(Boolean).slice(0,MAX_TYPES);
    if(!d.dutyTypeSchedules || typeof d.dutyTypeSchedules!=='object' || Array.isArray(d.dutyTypeSchedules)){
      d.dutyTypeSchedules={};
    }
    Object.keys(d.dutyTypeSchedules).forEach(k=>{
      const sch=d.dutyTypeSchedules[k];if(!sch||typeof sch!=='object')return;
      if(!sch.assignments||typeof sch.assignments!=='object')sch.assignments={};
      if(sch.rows&&typeof sch.rows==='object'){
        Object.keys(sch.rows).forEach(person=>{sch.assignments[person]=sch.assignments[person]||{};Object.assign(sch.assignments[person],sch.rows[person]||{});});
        delete sch.rows;
      }
    });

    return d;
  }

  
  /* KM_DUTY_UNFREEZE_V1_DEBOUNCE_SAVE */
  window.__kmDutySaveTimer=null;
  window.kmDutySaveDebounced=function(){ /* KM_SAVE_LIGHT_V1_DUTY_DEBOUNCE */
    if(typeof window.kmSaveLightDebounced==='function') window.kmSaveLightDebounced();
    else {
      window.__kmGraphDirty=true;
      if(window.__kmDutySaveTimer) clearTimeout(window.__kmDutySaveTimer);
      window.__kmDutySaveTimer=setTimeout(function(){
        window.__kmDutySaveTimer=null;
        if(typeof window.kmFlushGraphDirty==='function') window.kmFlushGraphDirty();
      }, 1200);
    }
  };
  window.kmDutyFlushSave=async function(){
    if(window.__kmDutySaveTimer){ clearTimeout(window.__kmDutySaveTimer); window.__kmDutySaveTimer=null; }

  function getSchedule(index){
    const d=ensureAll(); if(!d) return null;
    /* KM_GRAPH_CAP_V1_GET */
    const type=d.dutyTypes[index]; if(!type) return null;
    const key='duty_'+index;
    const baseSchedule=(d.schedule&&typeof d.schedule==='object')?d.schedule:{};
    if(!d.dutyTypeSchedules[key] || typeof d.dutyTypeSchedules[key]!=='object'){
      d.dutyTypeSchedules[key]={
        name:type,
        day:1,
        month:+baseSchedule.month || new Date().getMonth()+1,
        year:+baseSchedule.year || new Date().getFullYear(),
        assignments:{},
        selectedPeople:[],
        formalGraph: (typeof kmFormalDefaults==='function'?kmFormalDefaults():{})
      };
    }
    const sch=d.dutyTypeSchedules[key];
    /* KM_GRAPH_CAP_V1_CLAMP_SCH */ if(typeof window.kmClampGraphSelectedPeople==='function') window.kmClampGraphSelectedPeople(sch,{warn:false});
    sch.name=type;
    if(!sch.assignments || typeof sch.assignments!=='object') sch.assignments={};
    kmEnsureGraphPersonnel(sch,[]);
    if(Array.isArray(sch.selectedPeople)){
      sch.selectedPeople=sch.selectedPeople.map(n=>String(n||'').trim()).filter(n=>n&&!kmPersonNameIsLoginStub(n)&&!kmPersonNameIsVacantStub(n)&&(typeof kmNameIsUsablePerson!=='function'||kmNameIsUsablePerson(n)));
    }
    if(!sch.formalGraph||typeof sch.formalGraph!=='object'){
      sch.formalGraph=typeof kmFormalDefaults==='function'?kmFormalDefaults():{};
    }else if(baseSchedule.formalGraph && sch.formalGraph===baseSchedule.formalGraph){
      sch.formalGraph=JSON.parse(JSON.stringify(baseSchedule.formalGraph));
    }
    sch.month=Math.max(1,Math.min(12,+sch.month||new Date().getMonth()+1));
    sch.year=Math.max(2020,Math.min(2100,+sch.year||new Date().getFullYear()));
    const maxDay=new Date(sch.year,sch.month,0).getDate();
    sch.day=Math.max(1,Math.min(maxDay,+sch.day||1));
    return sch;
  }

  function isVacation(name,y,m,d){

              return;

            const wk=cell.classList.contains('weekendColumn');

  window.kmRebalanceDutyPlansForVacations=async function(){
    const d=ensureAll();
    if(!d||!d.dutyTypeSchedules)return 0;
    let moved=0;
    Object.keys(d.dutyTypeSchedules).forEach(key=>{
      const sch=d.dutyTypeSchedules[key];
      if(!sch||typeof sch!=='object')return;
      const idx=Number(String(key).replace(/^duty_/,''));
      const type=(d.dutyTypes&&d.dutyTypes[idx])||'Հերթապահ';
      const people=(typeof kmPlanningPeopleFor==='function'?kmPlanningPeopleFor(sch):kmDutySelectedPeople(sch)).filter(p=>!kmPersonNotPlannable(p));
      const y=+sch.year,m=+sch.month;
      const days=new Date(y,m,0).getDate();
      if(!sch.assignments||typeof sch.assignments!=='object')sch.assignments={};

      Object.keys(sch.assignments).forEach(name=>{
        const row=sch.assignments[name];
        if(!row||typeof row!=='object')return;
        Object.keys(row).forEach(dd=>{
          if(!row[dd])return;
          if(isVacation(name,y,m,+dd))delete row[dd];
        });
      });

      const occupied={};
      const lastDay={};
      Object.keys(sch.assignments).forEach(name=>{
        const busy=Object.keys(sch.assignments[name]||{}).filter(x=>sch.assignments[name][x]).map(Number);
        busy.forEach(day=>{occupied[day]=name;});
        if(busy.length)lastDay[name]=Math.max.apply(null,busy);
      });

      for(let day=1;day<=days;day++){
        if(occupied[day])continue;
        const chosen=kmPickPersonForDutyDay(people,day,lastDay,{
          nameOf:personName,
          unavailable:(p,name,dd)=>isBadDay(p,dd)||isVacation(name,y,m,dd)||(typeof kmPersonEligibleForDuty==='function'&&!kmPersonEligibleForDuty(p,type))||(typeof kmSkipHolidaysInPlan==='function'&&kmSkipHolidaysInPlan()&&typeof kmIsArmenianHoliday==='function'&&kmIsArmenianHoliday(y,m,dd)),
          busyDays:name=>Object.keys(sch.assignments[name]||{}).filter(x=>sch.assignments[name][x]).map(Number)
        });
        if(!chosen)continue;
        const name=personName(chosen);
        sch.assignments[name]=sch.assignments[name]||{};
        sch.assignments[name][String(day)]=type;
        lastDay[name]=day;
        occupied[day]=name;
        moved++;
      }
    });
    return moved;
  };

  window.autoPlanDutyType=async function(index){
    try{
      const d=ensureAll(); const sch=getSchedule(index);
      if(!d||!sch)return;
      const graphPeople=kmDutySelectedPeople(sch);
      if(!graphPeople.length){alert('Նախ ընտրեք անձնակազմ։');return;}
      const planningPeople=graphPeople.filter(p=>!kmPersonNotPlannable(p)&&(typeof kmPersonEligibleForDuty!=='function'||kmPersonEligibleForDuty(p,d.dutyTypes[index])));
      if(!planningPeople.length){alert('Ընտրված անձնակազմը արգելափակված է կամ կոչումը չի թույլատրվում այս վերակարգում։');return;}
      const type=d.dutyTypes[index];
      const nameOf=(p)=>kmDutyPersonKey(p,sch)||personName(p);
      sch.assignments={};
      graphPeople.forEach(p=>{
        if(typeof kmPersonIsVacantStub==='function'&&kmPersonIsVacantStub(p))return;
        const name=nameOf(p);
        if(typeof kmPersonNameIsVacantStub==='function'&&kmPersonNameIsVacantStub(name))return;
        sch.assignments[name]=sch.assignments[name]||{};
        // mirror empty rows under all aliases so sanitize/prune see busy/selected consistently
        kmDutyNameAliases(p,sch).forEach(function(a){ sch.assignments[a]=sch.assignments[name]; });
      });
      Object.keys(sch.assignments).forEach(k=>{
        if(typeof kmPersonNameIsVacantStub==='function'&&kmPersonNameIsVacantStub(k))delete sch.assignments[k];
      });
      const days=new Date(+sch.year,+sch.month,0).getDate();
      const planned=kmApplyTwoPassDutyPlan(planningPeople,days,{
        nameOf:nameOf,
        unavailable:(p,name,dd)=>isBadDay(p,dd)||isVacation(name,+sch.year,+sch.month,dd)||(typeof kmPersonEligibleForDuty==='function'&&!kmPersonEligibleForDuty(p,type))||(typeof kmSkipHolidaysInPlan==='function'&&kmSkipHolidaysInPlan()&&typeof kmIsArmenianHoliday==='function'&&kmIsArmenianHoliday(+sch.year,+sch.month,dd)),
        busyDays:name=>{
          const row=sch.assignments[name]||{};
          return Object.keys(row).filter(x=>String(row[x]||'').trim()).map(Number);
        },
        setDuty:(name,day)=>{sch.assignments[name]=sch.assignments[name]||{};sch.assignments[name][String(day)]=type;},
        hasDuty:(name,day)=>!!(sch.assignments[name]&&(sch.assignments[name][String(day)]||sch.assignments[name][day]))
      });
      const unassigned=planned.unassigned;
      /* KM_DUTY_GRID_VISIBLE_V2: align keys, paint first, then save */
      kmDutyAlignAssignmentKeys(sch);
      let filledCells=0;
      Object.keys(sch.assignments||{}).forEach(nm=>{
        const row=sch.assignments[nm]||{};
        Object.keys(row).forEach(d=>{ if(String(row[d]||'').trim()) filledCells++; });
      });
      // unique cells (aliases share row refs) — recount via people
      filledCells=0;
      graphPeople.forEach(p=>{
        for(let day=1; day<=days; day++){ if(kmDutyGetAssigned(sch,p,day)) filledCells++; }
      });
      renderDutyTypePlanning(index);
      try{ await safeSave(); }catch(eSave){ console.error(eSave); }
      renderDutyTypePlanning(index);
      const assignedDays=planned.assigned||0;
      if(!filledCells){
        toast('Պլանավորումն ավարտվեց, բայց ցանցում նշանակում չերևաց։ Կրկին սեղմեք «Ավտոմատ պլանավորում» կամ ընտրեք անձնակազմ։','error');
      }else if(unassigned.length){
        toast('Պահպանումն ավարտվեց։ Նշանակված օրեր՝ '+assignedDays+'։ Առանց թեկնածուի օրեր՝ '+unassigned.length+' ('+unassigned.join(', ')+')։ Բջիջներ՝ '+filledCells+'։','warn');
      }else{
        toast('Պահպանումն ավարտվեց։ Նշանակված օրեր՝ '+assignedDays+'։ Բջիջներ՝ '+filledCells+'։');
      }
    }catch(e){console.error(e);alert('Ավտոմատ պլանավորման ժամանակ սխալ առաջացավ։');}
  };

  window.checkDutyTypePlanning=function(index){
    try{
      const sch=getSchedule(index); if(!sch)return;
      const cnt={};
      const gapIssues=[];
      const minGap=typeof kmMinDutyGap==='function'?kmMinDutyGap():3;
      Object.entries(sch.assignments||{}).forEach(([name,ds])=>{
        const days=Object.keys(ds||{}).filter(day=>ds[day]).map(Number).sort((a,b)=>a-b);
        for(let i=1;i<days.length;i++){
          if(days[i]-days[i-1]<minGap)gapIssues.push(name+': '+days[i-1]+' և '+days[i]+' կողք-կողքի են (պետք է '+minGap+' օր)։');
        }
        const maxDuty=typeof kmMaxDutyPerPerson==='function'?kmMaxDutyPerPerson():5;
        if(days.length>maxDuty)gapIssues.push(name+': ընդգրկված է '+days.length+' անգամ — առավելագույնը '+maxDuty+'։');
        days.forEach(day=>{if(ds[day])cnt[day]=(cnt[day]||0)+1;});
      });
      const dup=Object.keys(cnt).filter(day=>cnt[day]>1);
      const parts=[];
      if(dup.length)parts.push('Կրկնակի նշանակված օրեր՝ '+dup.join(', '));
      if(gapIssues.length)parts.push(gapIssues.join('\n'));
      alert(parts.length?parts.join('\n'):'Ստուգումն ավարտվեց․ կողք-կողքի և կրկնակի նշանակումներ չկան։');
    }catch(e){console.error(e);}
  };

  window.clearDutyTypePlanning=function(index){
    try{
      if(!confirm('Մաքրե՞լ այս վերակարգի պլանավորումը։'))return;
      const sch=getSchedule(index); if(!sch)return;
      sch.assignments={};
      renderDutyTypePlanning(index);
    }catch(e){console.error(e);}
  };

  window.saveDutyTypePlanning=async function(index){ /* KM_DUTY_UNFREEZE_V1_FLUSH_SAVE */
    if(typeof window.kmDutyFlushSave==='function') await window.kmDutyFlushSave();
    else await safeSave();alert('Վերակարգի պլանավորումը պահպանվեց և ստուգվեց։')};

  // Catch UI errors so one broken handler cannot blank/close the whole app.
  window.addEventListener('error',function(ev){
    console.error('KM UI error:',ev.error||ev.message);
  });
  window.addEventListener('unhandledrejection',function(ev){
    console.error('KM async error:',ev.reason);
    ev.preventDefault();
  });
})();
</script>

  var DATA=[{"key":"cc","label":"ՀՀ Քաղաքացիական օրենսգիրք","articlesLabel":"Հոդված 1110–1123","arlisTitle":"ՀՀ ՔԱՂԱՔԱՑԻԱԿԱՆ ՕՐԵՆՍԳԻՐՔ","meta":{"Համար":"ՀՕ-239","Տիպ":"Օրենսգիրք","Փաստաթղթի տեսակ":"Ինկորպորացիա","Կարգավիճակ":"Գործում է (30.08.2026-մինչ օրս)","Սկզբնաղբյուր":"ՀՀՊՏ 1998.08.10/17(50)","Ընդունման ամսաթիվ":"05.05.1998","Ուժի մեջ մտնելու ամսաթիվ":"01.01.1999"},"url":"https://www.arlis.am/hy/acts/29/latest","retrieved":"2026-09-28","articles":[{"num":"1110","title":"Բացառիկ իրավունքների պաշտպանության եղանակները","lines":[["p","1. Բացառիկ իրավունքների պաշտպանությունն իրականացվում է սույն օրենսգրքի 14 հոդվածով նախատեսված եղանակներով: Բացառիկ իրավունքների պաշտպանությունը կարող է իրականացվել նաև`"],["p","1) բացառիկ իրավունքների խախտման համար հիմք ծառայած և նման խախտման արդյունքում ստեղծված նյութական օբյեկտների առգրավմամբ."],["p","2) թույլ տրված խախտման վերաբերյալ պարտադիր հրապարակմամբ` դրանում ներառելով տեղեկություններ այն մասին, թե ում է պատկանում խախտված իրավունքը, ինչպես նաև թույլ տրված խախտման վերաբերյալ իրավախախտողի հաշվին՝ դատական վճռի ամբողջությամբ կամ մասնակիորեն պարտադիր հրապարակմամբ՝ իրավատիրոջ նշած Հայաստանի Հանրապետությունում գործող զանգվածային լրատվամիջոցում."],["p","3) օրենքով նախատեսված այլ եղանակներով:"],["p","2. Մտավոր գործունեության արդյունքների և անհատականացման միջոցների օգտագործման պայմանագրերը խախտվելու դեպքում կիրառվում են պարտավորությունների խախտման համար պատասխանատվության մասին ընդհանուր կանոնները (գլուխ 26):"],["n","(1110-րդ հոդվածը լրաց. 15.06.06 ՀՕ-143-Ն)"]]},{"num":"1111","title":"Հեղինակային իրավունքի օբյեկտները","lines":[["p","1. Հեղինակային իրավունքը տարածվում է ստեղծագործական գործունեության արդյունք համարվող գիտության, գրականության և արվեստի ստեղծագործությունների վրա` անկախ ստեղծագործության նշանակությունից ու արժանիքներից, ինչպես նաև այն արտահայտելու եղանակից:"],["p","2. Ստեղծագործությունը պետք է արտահայտվի բանավոր, գրավոր կամ այն ընկալելու հնարավորությունը թույլատրող այլ օբյեկտիվ ձևով:"],["p","3. Գրավոր կամ այլ կերպ նյութական կրիչի (ձեռագրի, մեքենագրի, նոտագրի, տեխնիկական միջոցների օգնությամբ ամրակայված` ներառյալ ձայնագրությամբ կամ տեսագրությամբ արտահայտված, երկչափ կամ ծավալային-տարածքային ձևով պատկերի վրա ամրագրված և այլն) վրա արտահայտված ստեղծագործությունը համարվում է օբյեկտիվ ձև ունեցող` անկախ երրորդ անձանց համար այն մատչելի լինելուց:"],["p","4. Նյութական կրիչի վրա չարտահայտված բանավոր կամ այլ ստեղծագործությունը համարվում է օբյեկտիվ ձև ունեցող, եթե այն մատչելի է դարձել երրորդ անձանց ընկալման համար (հրապարակային արտասանություն, հրապարակային կատարում և այլն):"],["p","5. Հեղինակային իրավունքը տարածվում է ինչպես հրապարակված, այնպես էլ չհրապարակված ստեղծագործությունների վրա:"],["p","6. Հեղինակային իրավունքը չի տարածվում գիտական հայտնագործությունների, գաղափարների, սկզբունքների, մեթոդների, ընթացակարգերի, տեսակետների, համակարգերի, արարողակարգերի, գիտական տեսությունների, մաթեմատիկական բանաձևերի, վիճակագրական դիագրամների, խաղի կանոնների վրա, եթե անգամ դրանք արտահայտված, նկարագրված, բացահայտված, լուսաբանված են ստեղծագործություններում:"],["n","(1111-րդ հոդվածը խմբ. 15.06.06 ՀՕ-143-Ն)"]],"chapter":["Գ Լ ՈՒ Խ 63","ՀԵՂԻՆԱԿԱՅԻՆ ԻՐԱՎՈՒՆՔ"]},{"num":"1112","title":"Հեղինակային իրավունքի օբյեկտների տեսակները","lines":[["p","Հեղինակային իրավունքի օբյեկտներ են`"],["p","1) գրական (գրական-գեղարվեստական, գիտական, ուսումնական, հրապարակախոսական և այլ) ստեղծագործությունները."],["p","2) դրամատիկական և սցենարային ստեղծագործությունները."],["p","3) տեքստով և առանց տեքստի երաժշտական ստեղծագործությունները."],["p","4) երաժշտական դրամատիկական ստեղծագործությունները."],["p","5) պարարվեստի ստեղծագործությունները և մնջախաղերը."],["p","6) տեսալսողական ստեղծագործությունները (կինոֆիլմերը, հեռուստաֆիլմերը և տեսաֆիլմերը, տեսասլայդային ֆիլմերը, դիաֆիլմերը և այլ կինո, հեռուստատեսային և տեսաստեղծագործությունները), ռադիոստեղծագործությունները."],["p","7) գեղանկարչության, քանդակագործության, գրաֆիկայի, դիզայնի և կերպարվեստի այլ ստեղծագործությունները."],["p","8) դեկորատիվ-կիրառական արվեստի և բեմական գրաֆիկայի ստեղծագործությունները."],["p","9) ճարտարապետության, քաղաքաշինության և այգեպուրակային արվեստի ստեղծագործությունները."],["p","10) լուսանկարչական ստեղծագործությունները և լուսանկարչությանը նմանօրինակ եղանակներով ստացված ստեղծագործությունները."],["p","11) աշխարհագրությանը, տոպոգրաֆիային և այլ գիտություններին վերաբերող աշխարհագրական, երկրաբանական ու այլ քարտեզները, նախագծերը, էսքիզները և պլաստիկ ստեղծագործությունները."],["p","12) համակարգչային ծրագրերը."],["p","13) տառատեսակները."],["p","14) սույն օրենսգրքի 1111 հոդվածով սահմանված պահանջներին բավարարող այլ ստեղծագործությունները:"],["n","(1112-րդ հոդվածը խմբ. 15.06.06 ՀՕ-143-Ն)"]]},{"num":"1113","title":"Ստեղծագործության մասերը և ածանցյալ ստեղծագործությունները","lines":[["p","1. Հեղինակային իրավունքի օբյեկտ են` սույն օրենսգրքի 1111 հոդվածով սահմանված պահանջները բավարարող ստեղծագործությունների մասերը, դրանց անվանումները և ածանցյալ ստեղծագործությունները:"],["p","2. Ածանցյալ ստեղծագործություններ են`"],["p","1) այլ ստեղծագործությունների վերամշակումները (մշակումները, անոտացիաները, ռեֆերատները, ամփոփումները, տեսությունները, բեմականացումները, դաշնակումները և գիտության, գրականության ու արվեստի այլ նմանատիպ ստեղծագործությունները)."],["p","2) թարգմանությունները."],["p","3) ժողովածուները (հանրագիտարանները, անթոլոգիաները), տվյալների բազաները և իրենցից ըստ նյութերի ընտրության կամ տեղաբաշխման ստեղծագործական աշխատանքի արդյունք ներկայացնող այլ հավաքածո ստեղծագործությունները:"],["p","3. Ածանցյալ ստեղծագործությունները պահպանվում են հեղինակային իրավունքով` անկախ այն ստեղծագործության հեղինակային իրավունքի օբյեկտ լինելու հանգամանքից, որի վրա դրանք հիմնված են կամ որը ներառում են:"],["n","(1113-րդ հոդվածը փոփ. 15.06.06 ՀՕ-143-Ն)"]]},{"num":"1114","title":"Հեղինակային իրավունքի օբյեկտ չհամարվող ստեղծագործությունները","lines":[["p","Հեղինակային իրավունքի օբյեկտ չեն`"],["p","1) պաշտոնական փաստաթղթերը (օրենքները, որոշումները, վճիռները և այլն), ինչպես նաև դրանց պաշտոնական թարգմանությունները."],["p","2) պաշտոնական խորհրդանիշները և նշանները (դրոշները, զինանշանները, շքանշանները, դրամանիշները և այլն)."],["p","3) ժողովրդական բանահյուսության և արվեստի ստեղծագործությունները."],["p","4) օրվա նորությունների կամ ընթացիկ իրադարձությունների մասին մամլո տեղեկատվության բնույթ ունեցող սովորական հաղորդումները."],["p","5) առանց մարդու ստեղծագործական գործունեության` տեխնիկական միջոցների օգնությամբ ստացված արդյունքները."],["p","6) քաղաքական ելույթները, դատավարության ընթացքում արտասանված ճառերը։"],["n","(1114-րդ հոդվածը խմբ., լրաց. 15.06.06 ՀՕ-143-Ն)"]]},{"num":"1115","title":"Պաշտոնական փաստաթղթերի, խորհրդանիշների և նշանների նախագծերի նկատմամբ իրավունքները","lines":[["p","1. Պաշտոնական փաստաթղթերի, խորհրդանիշների կամ նշանների նախագծի նկատմամբ հեղինակության իրավունքը պատկանում է նախագիծ ստեղծած անձին (մշակողին):"],["p","2. Պաշտոնական փաստաթղթերի, խորհրդանիշների և նշանների նախագծեր մշակողներն իրավունք ունեն հրապարակել նախագիծը, եթե նախագիծը մշակելու հանձնարարությունը տվող մարմինն այն չի արգելում: Նախագիծը հրապարակելիս մշակողներն իրավունք ունեն նշել իրենց անունը:"],["p","3. Իրավասու մարմինը պաշտոնական փաստաթուղթ նախապատրաստելու նպատակով կարող է նախագիծն օգտագործել առանց մշակողի համաձայնության, եթե նախագիծը հրապարակել կամ համապատասխան մարմին է ուղարկել մշակողը:"],["p","4. Նախագծի հիման վրա պաշտոնական փաստաթղթեր, խորհրդանիշներ և նշաններ նախապատրաստելիս պաշտոնական փաստաթուղթը, խորհրդանիշը կամ նշանը նախապատրաստող մարմնի հայեցողությամբ նախագծում կարող են կատարվել լրացումներ և փոփոխություններ:"],["p","5. Իրավասու մարմնի կողմից հավանության արժանանալու դեպքում նախագիծը կարող է օգտագործվել առանց մշակողի անունը նշելու:"]]},{"num":"1116","title":"Հեղինակային իրավունքի ծագումը: Հեղինակության կանխավարկածը","lines":[["p","1. Գիտության, գրականության կամ արվեստի ստեղծագործության նկատմամբ հեղինակային իրավունքը ծագում է այն ստեղծելու փաստի ուժով: Հեղինակային իրավունքի ծագման համար չի պահանջվում ստեղծագործության գրանցում կամ որևէ այլ ձևականություն:"],["p","2. Հեղինակ է ճանաչվում այն անձը, ում անունը, որպես հեղինակ, նշված է ստեղծագործության վրա, կամ ում անունը որպես հեղինակ նշված է ստեղծագործությունը հրապարակելիս, կամ ում անունը որպես հեղինակ նշված է գույքային իրավունքները կոլեկտիվ հիմունքներով կառավարող համապատասխան կազմակերպությունում կամ նոտարի մոտ կամ օրենքով համապատասխան լիազորություն ունեցող այլ կազմակերպություններում ի պահ հանձնված ստեղծագործության օրինակի վրա, քանի դեռ հակառակն ապացուցված չէ։ Սույն դրույթը կիրառվում է նաև այն դեպքերում, երբ այդ անունը կեղծանուն է, և կեղծանունով հանդես եկող հեղինակի անձը կասկած չի հարուցում:"],["p","3. Ստեղծագործությունն անանուն կամ կեղծանվամբ լույս ընծայելիս (բացառությամբ այն դեպքի, երբ հեղինակի կեղծանունը որևէ կասկած չի հարուցում նրա անձի ով լինելու մասին) լույս ընծայողը, որի անունը կամ անվանումը նշված է ստեղծագործության վրա, այլ ապացույցների բացակայության դեպքում, համարվում է հեղինակի ներկայացուցիչը և իրավունք ունի պաշտպանել հեղինակի իրավունքներն ու ապահովել դրանց իրականացումը: Այս դրույթը գործում է այնքան ժամանակ, մինչև նման ստեղծագործության հեղինակը կբացահայտի իր անձը և կհայտարարի իր հեղինակության մասին:"],["n","(1116-րդ հոդվածը խմբ., փոփ. 15.06.06 ՀՕ-143-Ն)"]]},{"num":"1117","title":"Համահեղինակություն","lines":[["p","1. Երկու կամ ավելի քաղաքացիների համատեղ ստեղծագործական աշխատանքով ստեղծված ստեղծագործության նկատմամբ հեղինակային իրավունքը համահեղինակներին է պատկանում համատեղ` անկախ նրանից, այդ ստեղծագործությունը մեկ միասնական ամբողջությու՞ն է, թե՞ կազմված է մասերից, որոնցից յուրաքանչյուրն ունի նաև ինքնուրույն նշանակություն:"],["p","2. Ստեղծագործության առանձին մասը համարվում է ինքնուրույն նշանակություն ունեցող, եթե այն կարող է օգտագործվել ստեղծագործության մյուս մասերից անկախ:"],["p","3. Համահեղինակներից յուրաքանչյուրն իրավունք ունի իր հայեցողությամբ օգտագործել ստեղծագործության իր կողմից ստեղծված ինքնուրույն նշանակություն ունեցող մասը, եթե այլ բան նախատեսված չէ նրանց միջև կնքված պայմանագրով:"],["p","4. Համահեղինակների փոխհարաբերությունները սահմանվում են նրանց միջև կնքված պայմանագրով: Պայմանագրի բացակայության դեպքում համահեղինակները ստեղծագործության նկատմամբ հեղինակային իրավունքն իրականացնում են համատեղ, իսկ եկամուտը նրանց միջև բաշխվում է հավասար:"],["p","5. Եթե համահեղինակների ստեղծագործությունը կազմում է մեկ անբաժանելի ամբողջություն, ապա համահեղինակներից որևէ մեկն իրավունք չունի առանց բավարար հիմքերի արգելել մյուս համահեղինակներին՝ օգտագործելու ստեղծագործությունը:"],["n","(1117-րդ հոդվածը փոփ., խմբ., լրաց. 15.06.06 ՀՕ-143-Ն)"]]},{"num":"1118","title":"Ածանցյալ ստեղծագործությունների հեղինակները","lines":[["p","1. Ածանցյալ ստեղծագործությունների հեղինակներ են համարվում այլ անձանց ստեղծագործությունները վերամշակած անձինք` թարգմանիչները, ժողովածուներ և այլ հավաքածո ստեղծագործություններ կազմողները:"],["p","2. Ածանցյալ ստեղծագործության հեղինակն օգտվում է նման ստեղծագործության նկատմամբ հեղինակային իրավունքից` վերամշակված, թարգմանված կամ հավաքածո ստեղծագործության մեջ ներառված ստեղծագործության հեղինակի իրավունքը պահպանելու պայմանով:"],["p","3. Ածանցյալ ստեղծագործություններ ստեղծողների հեղինակային իրավունքը չի խոչընդոտում այլ անձանց արդեն իսկ օգտագործված ստեղծագործությունների հիման վրա ստեղծելու իրենց ածանցյալ ստեղծագործությունները, եթե պահպանված է սույն հոդվածի 2-րդ կետի պայմանը:"],["n","(1118-րդ հոդվածը լրաց. 15.06.06 ՀՕ-143-Ն)"]]},{"num":"1119","title":"Ստեղծագործությունների ստեղծումը կազմակերպող անձանց իրավունքները","lines":[["p","1. Ստեղծագործությունների ստեղծումը կազմակերպող անձինք (հանրագիտարանների հրատարակիչները, ֆիլմեր պատրաստողները, պրոդյուսերները և այլք) չեն համարվում համապատասխան ստեղծագործությունների հեղինակներ: Սակայն, սույն օրենսգրքով և այլ օրենքներով սահմանված դեպքերում, նման անձինք բացառիկ իրավունքներ են ձեռք բերում այդ ստեղծագործությունների օգտագործման նկատմամբ:"],["p","2. Հանրագիտարանների, հանրագիտական բառարանների, գիտական աշխատանքների պարբերական կամ շարունակվող ժողովածուների, թերթերի, ամսագրերի և այլ պարբերական հրատարակությունների հրատարակիչները նման հրատարակություններն օգտագործելու բացառիկ իրավունք ունեն: Հրատարակիչն իրավունք ունի նման հրատարակության ցանկացած օգտագործման դեպքում նշել կամ պահանջել, որ նշվի իր անվանումը:"],["p","Նման հրատարակություններում ներառված ստեղծագործությունների հեղինակները պահպանում են իրենց ստեղծագործություններն օգտագործելու բացառիկ իրավունքներ` անկախ այն ամբողջությամբ հրատարակելու հանգամանքից, եթե այլ բան նախատեսված չէ ստեղծագործության ստեղծման պայմանագրով:"]]},{"num":"1120","title":"Հեղինակային իրավունքի պահպանության նշանը","lines":[["n","(վերնագիրը փոփ. 15.06.06 ՀՕ-143-Ն)"],["p","1. Բացառիկ գույքային իրավունքների տիրապետողն իր իրավունքների մասին ծանուցելու նպատակով կարող է օգտագործել հեղինակային իրավունքի պահպանության նշան, որը տեղադրվում է ստեղծագործության բնօրինակի կամ յուրաքանչյուր օրինակի վրա և կազմված է`"],["p","1) շրջանակի մեջ վերցված լատիներեն «C» տառից."],["p","2) բացառիկ հեղինակային իրավունքները տիրապետողի անունից (անվանումից)."],["p","3) ստեղծագործության առաջին հրատարակության տարեթվից:"],["p","2. Իրավատեր է համարվում հեղինակային իրավունքի պահպանության նշանում հիշատակված անձը, եթե այլ բան ապացուցված չէ:"],["n","(1120-րդ հոդվածը փոփ. 15.06.06 ՀՕ-143-Ն)"]]},{"num":"1121","title":"Հեղինակի անձնական ոչ գույքային իրավունքները","lines":[["p","1. Հեղինակի անձնական ոչ գույքային իրավունքները ապահովում են ստեղծագործության նկատմամբ նրա մտավոր և անձնական կապերը:"],["p","2. Հեղինակին են պատկանում ստեղծագործության նկատմամբ հետևյալ անձնական ոչ գույքային իրավունքները`"],["p","1) ստեղծագործության հեղինակ ճանաչվելու (հեղինակության իրավունք)."],["p","2) ստեղծագործությունն իր անվամբ, կեղծանվամբ կամ անանուն օգտագործելու կամ այդպիսի օգտագործումը թույլատրելու (հեղինակի անվան իրավունք)."],["p","3) ստեղծագործությունը հնարավոր աղավաղումներից, փոփոխություններից կամ հեղինակի համբավին կամ արժանապատվությանը վնաս հասցնող այլ ոտնձգություններից պաշտպանելու (հեղինակի համբավի և արժանապատվության իրավունք)."],["p","4) ստեղծագործությունը ցանկացած ձևով առաջին անգամ հրապարակելու կամ այդ իրավունքն այլ անձի վերապահելու (հրապարակման իրավունք)."],["p","5) ստեղծագործությունը հրապարակելու մասին նախկինում ընդունած որոշումից հրաժարվելու (հետկանչի իրավունք` դրա հետևանքով ստեղծագործությունն օգտագործելու իրավունք ունեցող անձանց պատճառած վնասները (ներառյալ` բաց թողնված օգուտը) հատուցելու պայմանով։ Եթե ստեղծագործությունն արդեն իսկ լույս է ընծայվել, ապա հեղինակը պարտավոր է հրապարակայնորեն ծանուցել դրա հետկանչի մասին: Ընդ որում, նա իրավունք ունի ստեղծագործության նախկինում պատրաստված օրինակները շրջանառությունից հանելու` հոգալով անհրաժեշտ ծախսերը: Սույն կետի դրույթները չեն տարածվում համակարգչային ծրագրերի, տեսալսողական ստեղծագործությունների, տվյալների բազաների, ինչպես նաև ծառայողական ստեղծագործությունների վրա, եթե հեղինակի և գործատուի միջև կնքված պայմանագրով այլ բան նախատեսված չէ:"],["p","3. Անձնական ոչ գույքային իրավունքներն անօտարելի և անփոխանցելի են և պահպանվում են անժամկետ, բացառությամբ հետկանչի իրավունքի, որը գործում է միայն հեղինակի կյանքի ընթացքում։"],["n","(1121-րդ հոդվածը խմբ. 04.12.01 ՀՕ-270, 15.06.06 ՀՕ-143-Ն)"]]},{"num":"1122","title":"Ստեղծագործության անձեռնմխելիության իրավունքը","lines":[["n","(հոդվածն ուժը կորցրել է 15.06.06 ՀՕ-143-Ն)"]]},{"num":"1123","title":"Ստեղծագործությունը հրապարակելու իրավունքը","lines":[["n","(հոդվածն ուժը կորցրել է 15.06.06 ՀՕ-143-Ն)"]]}],"missing":[]},{"key":"copyright","label":"«Հեղինակային իրավունքի և հարակից իրավունքների մասին» ՀՀ օրենք","articlesLabel":"Հոդված 65–66","arlisTitle":"ՀՀ ՕՐԵՆՔԸ ՀԵՂԻՆԱԿԱՅԻՆ ԻՐԱՎՈՒՆՔԻ ԵՎ ՀԱՐԱԿԻՑ ԻՐԱՎՈՒՆՔՆԵՐԻ ՄԱՍԻՆ","meta":{"Համար":"ՀՕ-142-Ն","Տիպ":"Օրենք","Փաստաթղթի տեսակ":"Պաշտոնական Ինկորպորացիա","Կարգավիճակ":"Գործում է (09.11.2013-մինչ օրս)","Սկզբնաղբյուր":"ՀՀՊՏ 2006.07.12/38(493) Հոդ.816","Ընդունման ամսաթիվ":"15.06.2006","Ուժի մեջ մտնելու ամսաթիվ":"22.07.2006"},"url":"https://www.arlis.am/hy/acts/86179/latest","retrieved":"2026-09-28","articles":[{"num":"65","title":"Հեղինակային իրավունքի և հարակից իրավունքների խախտում համարվող գործողությունները","lines":[["p","1. Սույն օրենքով պահպանվող ստեղծագործության կամ դրա էական մասի կամ հարակից իրավունքների օբյեկտի ցանկացած օգտագործում անօրինական է, եթե նախապես, մինչև նման օգտագործումը ձեռք չի բերվել հեղինակային իրավունքի կամ հարակից իրավունքների իրավատիրոջ թույլտվությունը։"],["p","Ստեղծագործության էական մաս է համարվում ստեղծագործության որևէ մասը, որը տվյալ ստեղծագործությանը ծանոթ ցանկացած անձ ինքնուրույն կարող է նույնականացնել որպես այդ ստեղծագործության մաս։"],["p","2. Անձը, որը չի կատարում սույն օրենքի պահանջները, համարվում է հեղինակային իրավունքը կամ հարակից իրավունքները խախտող։"],["p","3. Առանց իրավատիրոջ թույլտվության պատրաստված կամ տարածված իրավունքի օբյեկտի օրինակները համարվում են կեղծ կամ նմանակված (կոնտրաֆակտ)։"],["p","Նմանակված օրինակ է համարվում նաև Հայաստանի Հանրապետությունում սույն օրենքով պահպանվող ստեղծագործության, հնչյունագրի (կամ տեսագրության) այն օրինակը, որն առանց հեղինակային իրավունքի և հարակից իրավունքների իրավատերերի համաձայնության Հայաստանի Հանրապետություն է ներմուծվում այլ պետություններից, որտեղ այդ ստեղծագործությունը, հնչյունագիրը (կամ տեսագրությունը) երբևէ չի պահպանվել, կամ դադարել է դրա պահպանությունը:"],["p","4. Ուրիշի ստեղծագործությունից մտքեր, հատվածներ քաղելը առանց դրանց ստեղծագործական վերամշակման և առանց ձեռքբերման սկզբնաղբյուրի նշման և որպես իրենը ներկայացնելը կամ ստեղծագործությունն ամբողջությամբ իր անունով ներկայացնելը համարվում է գրագողություն։"],["p","5. Հեղինակային իրավունքի կամ հարակից իրավունքների խախտման համար նախատեսվում է պատասխանատվություն՝ օրենքով սահմանված կարգով:"]]},{"num":"66","title":"Հեղինակային իրավունքի և հարակից իրավունքների պաշտպանությունը","lines":[["p","1. Հեղինակային իրավունքի կամ հարակից իրավունքների իրավատերն իր իրավունքները պաշտպանելու նպատակով կարող է Հայաստանի Հանրապետության օրենսդրությամբ սահմանված կարգով դիմել դատարան:"],["p","2. Հեղինակային իրավունքի կամ հարակից իրավունքների իրավատերն իր իրավունքները պաշտպանելու նպատակով, դատական կարգով, իր իրավունքները խախտողից կարող է պահանջել՝"],["p","ա) իր իրավունքների ճանաչում."],["p","բ) մինչև իրավախախտումը գոյություն ունեցող դրության վերականգնում և իրավունքը խախտող կամ խախտման վտանգ պարունակող գործողությունների կասեցում."],["p","գ) նմանակված օրինակների, դրանց պատրաստման համար օգտագործվող նյութերի ու սարքավորումների բռնագրավում կամ ոչնչացում."],["p","դ) վնասի հատուցում (ներառյալ՝ բաց թողնված օգուտը)` օրենքով սահմանված կարգով: Սույն օրենքի 22.1-ին հոդվածի խախտման դեպքում վնասի հատուցումը կազմում է սահմանված նվազագույն աշխատավարձի հարյուրապատիկից երկուհարյուրապատիկը."],["p","ե) հոնորարի կամ վարձատրության կրկնակի չափով փոխհատուցում, որը իրավատերը կստանար, եթե իրավախախտողը թույլտվություն ունենար հեղինակային իրավունքի օբյեկտի օգտագործման համար, կամ փաստացի խախտման վնասին համարժեք վնասների հատուցում, ներառյալ՝ բաց թողնված օգուտը."],["p","զ) դատական վճռի հրապարակումը Հայաստանի Հանրապետությունում գործող զանգվածային լրատվության միջոցներով՝ դատարանի կողմից նախատեսված չափով և մասով, իրավախախտողի միջոցների հաշվին."],["p","է) իր իրավունքների պաշտպանության հետ կապված՝ Հայաստանի Հանրապետության օրենսդրությամբ սահմանված այլ միջոցների կիրառում:"],["p","3. Սույն հոդվածի երկրորդ մասի «գ», «դ» և «ե» կետերում նշված միջոցների ընտրության իրավունքը պատկանում է հեղինակային իրավունքի կամ հարակից իրավունքների իրավատիրոջը:"],["p","4. Հեղինակային իրավունքի կամ հարակից իրավունքների իրավատերը կարող է պահանջել, որ այն անձինք, ովքեր որևէ կերպ առնչվում են սույն օրենքով պահպանվող իրավունքների խախտմանը (արտադրողներ, տպագրողներ, ներկրողներ, նմանակված օրինակներ կամ իրավախախտում առաջացնող սարքավորումներ տիրապետողներ), պահանջի դեպքում անմիջապես տեղեկություններ հայտնեն կեղծ օրինակների արտադրությանը և տարածմանը մասնակցող երրորդ անձանց, ինչպես նաև այդ օրինակների ձեռքբերման աղբյուրների ու տարածման ուղիների մասին և ներկայացնեն խախտմանն առնչվող փաստաթղթերը։"],["p","Սույն մասում նշված անձինք, որոնք հրաժարվում են տրամադրել պահանջված տեղեկությունը կամ փաստաթղթերը, պատասխանատվություն են կրում այն վնասների համար, որոնք կարող են պատճառվել նշված պարտականությունը կատարելուց հրաժարվելու հետևանքով։"],["p","5. Հեղինակային իրավունքի կամ հարակից իրավունքների իրավատիրոջ չպահանջած նմանակված օրինակները, ինչպես նաև դրանց ստեղծման և վերարտադրման համար օգտագործված նյութերն ու սարքավորումները դատարանի վճռով կարող են ոչնչացվել:"],["n","(66-րդ հոդվածը լրաց. 30.09.13 ՀՕ-106-Ն)"]]}],"missing":[]},{"key":"avo","label":"ՀՀ Վարչական իրավախախտումների վերաբերյալ օրենսգիրք","articlesLabel":"Հոդված 41.7","arlisTitle":"ՎԱՐՉԱԿԱՆ ԻՐԱՎԱԽԱԽՏՈՒՄՆԵՐԻ ՎԵՐԱԲԵՐՅԱԼ ՀՀ ՕՐԵՆՍԳԻՐՔ","meta":{"Տիպ":"Օրենսգիրք","Փաստաթղթի տեսակ":"Ինկորպորացիա","Կարգավիճակ":"Գործում է (01.09.2026-մինչ օրս)","Սկզբնաղբյուր":"ՀՍՍՀԳՍՏ 1985/23","Ընդունման ամսաթիվ":"06.12.1985","Ուժի մեջ մտնելու ամսաթիվ":"01.06.1986"},"url":"https://www.arlis.am/hy/acts/20/latest","retrieved":"2026-09-28","articles":[{"num":"41.7","title":"Հեղինակային և հարակից իրավունքները խախտելը","lines":[["p","1. Հեղինակությունը յուրացնելը կամ հեղինակային կամ հարակից իրավունքի օբյեկտն ապօրինի օգտագործելը կամ առանց հեղինակային իրավունքի կամ հարակից իրավունքների իրավատիրոջ համաձայնության նրա ստեղծագործությունն իրացնելը, եթե դա մանր չափերի գույքային վնաս է պատճառել հեղինակին կամ այլ իրավատիրոջ՝"],["p","առաջացնում է տուգանքի նշանակում՝ սահմանված նվազագույն աշխատավարձի հիսնապատիկից հարյուրապատիկի չափով։"],["p","2. Սույն հոդվածի իմաստով՝ մանր չափ է համարվում 500.000 Հայաստանի Հանրապետության դրամը չգերազանցող գումարը (արժեքը)։"],["n","(41.7-րդ հոդվածը լրաց. 09.06.22 ՀՕ-155-Ն)"]]}],"missing":[]},{"key":"crim","label":"ՀՀ Քրեական օրենսգիրք","articlesLabel":"Հոդված 227","arlisTitle":"ՀՀ ՔՐԵԱԿԱՆ ՕՐԵՆՍԳԻՐՔ","meta":{"Համար":"ՀՕ-199-Ն","Տիպ":"Օրենսգիրք","Փաստաթղթի տեսակ":"Ինկորպորացիա","Կարգավիճակ":"Գործում է (30.08.2026-մինչ օրս)","Սկզբնաղբյուր":"Միասնական կայք 2021.05.17-2021.05.30 Պաշտոնական հրապարակման օրը 27.05.2021","Ընդունման ամսաթիվ":"05.05.2021","Ուժի մեջ մտնելու ամսաթիվ":"01.07.2022"},"url":"https://www.arlis.am/hy/acts/230013/latest","retrieved":"2026-09-28","articles":[{"num":"227","title":"Հեղինակային և հարակից իրավունքները խախտելը","lines":[["p","1. Հեղինակությունը յուրացնելը կամ հեղինակային կամ հարակից իրավունքի օբյեկտն ապօրինի օգտագործելը կամ առանց հեղինակային իրավունքի կամ հարակից իրավունքների իրավատիրոջ համաձայնության նրա ստեղծագործությունը իրացնելը, եթե դա խոշոր չափերի գույքային վնաս է պատճառել         '<div class="kmLegalLawFoot">'+sourceHtml(act)+'</div>'+

    const customBox=dlg.querySelector('#kmCustomSizeBox');
    const marginBox=dlg.querySelector('#kmCustomMargins');
    const rangeBox=dlg.querySelector('#kmPageRangeBox');

    const sync=()=>{

    };
    sizeSel?.addEventListener('change',sync);
    marginSel?.addEventListener('change',sync);
    rangeSel?.addEventListener('change',sync);
    sync();

    dlg.querySelector('#kmSavePdfBtn')?.addEventListener('click',async()=>{
      try{
        const settings=collect(dlg);

        console.error('PDF print',e);
        toast('PDF սխալ՝ '+(e?.message||e),'error');

    const cancel=dlg.querySelector('#kmDlgCancel');
    const close=dlg.querySelector('#kmDlgX');
    if(cancel)cancel.addEventListener('click',()=>resolve({ok:false,cancelled:true}),{once:true});
    if(close)close.addEventListener('click',()=>resolve({ok:false,cancelled:true}),{once:true});
  });
};

<script id="KM-file-converters-v1">
(function(){
  'use strict';
  var lastConvertOutput='';

  function status(msg,type){
    var el=document.getElementById('converterStatus');
    if(!el)return;
    if(typeof kmTranslateUI==='function')msg=kmTranslateUI(msg);
    el.textContent=msg;
    el.className='converterStatus'+(type?' '+type:'');
  }

  function setResultActions(show){
    var bar=document.getElementById('convResultActions');
    if(bar)bar.style.display=show?'flex':'none';
  }

  function showConvertResult(r){
    lastConvertOutput=(r&&r.output)||'';
    var size=r&&r.size?(' ('+Math.round(r.size/1024)+' KB)'):'';
    status('Պատրաստ է՝ '+lastConvertOutput+size,'ok');
    setResultActions(!!lastConvertOutput);
  }

  function selected(id){
    var input=document.getElementById(id);
    var file=input&&input.files&&input.files[0];
    if(!file)throw new Error('Նախ ընտրիր ֆայլը։');
    return file;
  }

  async function nativeConvert(kind,file){
    if(!window.kmNative||!window.kmNative.convert)throw new Error('Native փոխակերպման համակարգը հասանելի չէ։');
    if(!file)throw new Error('Նախ ընտրիր ֆայլը։');
    var bytes=Array.from(new Uint8Array(await file.arrayBuffer()));
    return await window.kmNative.convert.run({kind:kind,name:file.name,bytes:bytes});
  }

  async function runConvert(kind,inputId,busyLabel){
    try{
      var f=selected(inputId);
      lastConvertOutput='';
      setResultActions(false);
      status(busyLabel,'busy');
      var r=await nativeConvert(kind,f);
      showConvertResult(r);
    }catch(e){
      console.error(e);
      lastConvertOutput='';
      setResultActions(false);
      status(e.message||'Փոխակերպման սխալ։','error');
    }
  }

  window.convertWordToPdf=function(){return runConvert('word-to-pdf','convWordPdf','Word → PDF փոխակերպում…');};
  window.convertPdfToWord=function(){return runConvert('pdf-to-word','convPdfWord','PDF → Word փոխակերպում…');};
  window.convertWordToExcel=function(){return runConvert('word-to-excel','convWordExcel','Word → Excel փոխակերպում…');};
  window.convertExcelToWord=function(){return runConvert('excel-to-word','convExcelWord','Excel → Word փոխակերպում…');};
  window.convertExcelToPdf=function(){return runConvert('excel-to-pdf','convExcelPdf','Excel → PDF փոխակերպում…');};
  window.convertPdfToExcel=function(){return runConvert('pdf-to-excel','convPdfExcel','PDF → Excel փոխակերպում…');};
  window.convertPptToPdf=function(){return runConvert('ppt-to-pdf','convPptPdf','PowerPoint → PDF փոխակերպում…');};
  window.convertPdfToPpt=function(){return runConvert('pdf-to-ppt','convPdfPpt','PDF → PowerPoint փոխակերպում…');};

  async function filesOf(id){
    var input=document.getElementById(id);
    var list=input&&input.files?Array.prototype.slice.call(input.files):[];
    if(!list.length)throw new Error('Նախ ընտրիր ֆայլը։');
    return list;
  }
  async function filePayload(file){
    return {name:file.name,bytes:Array.from(new Uint8Array(await file.arrayBuffer()))};
  }

  window.convertImagesToPdf=async function(){
    try{
      var list=await filesOf('convImagePdf');
      lastConvertOutput='';
      setResultActions(false);
      status('Նկար → PDF փոխակերպում…','busy');
      var files=[];
      for(var i=0;i<list.length;i++)files.push(await filePayload(list[i]));
      if(!window.kmNative||!window.kmNative.convert||!window.kmNative.convert.imagesPdf)throw new Error('Native փոխակերպման համակարգը հասանելի չէ։');
      var r=list.length===1
        ? await nativeConvert('image-to-pdf',list[0])
        : await window.kmNative.convert.imagesPdf({name:'KM_images.pdf',files:files});
      showConvertResult(r);
    }catch(e){
      lastConvertOutput='';
      setResultActions(false);
      status(e.message||'Փոխակերպման սխալ։','error');
    }
  };


  window.convertMergePdfs=async function(){
    try{
      var list=await filesOf('convPdfMerge');
      if(list.length<2)throw new Error('Միավորելու համար ընտրիր առնվազն 2 PDF։');
      lastConvertOutput='';
      setResultActions(false);
      status('PDF միավորում…','busy');
      var files=[];
      for(var i=0;i<list.length;i++)files.push(await filePayload(list[i]));
      if(!window.kmNative||!window.kmNative.convert||!window.kmNative.convert.mergePdf)throw new Error('Native փոխակերպման համակարգը հասանելի չէ։');
      var r=await window.kmNative.convert.mergePdf({name:'KM_merged.pdf',files:files});
      showConvertResult(r);
    }catch(e){
      lastConvertOutput='';
      setResultActions(false);
      status(e.message||'Փոխակերպման սխալ։','error');
    }
  };

  window.convertSplitPdf=async function(){
    try{
      var f=selected('convPdfSplit');
      lastConvertOutput='';
      setResultActions(false);
      status('PDF բաժանում…','busy');
      if(!window.kmNative||!window.kmNative.convert||!window.kmNative.convert.splitPdf)throw new Error('Native փոխակերպման համակարգը հասանելի չէ։');
      var r=await window.kmNative.convert.splitPdf(await filePayload(f));
      lastConvertOutput=(r&&(r.folder|| (r.files&&r.files[0])))||'';
      status('Բաժանվեց '+((r&&r.pages)||0)+' էջ՝ '+(r.folder||''),'ok');
      setResultActions(!!lastConvertOutput);
    }catch(e){
      lastConvertOutput='';
      setResultActions(false);
      status(e.message||'Փոխակերպման սխալ։','error');
    }
  };

  window.convertFolderBatch=async function(){
    var unsub=null;
    try{
      var kind=(document.getElementById('convFolderKind')||{}).value||'word-to-pdf';
      lastConvertOutput='';
      setResultActions(false);
      status('Պանակի փոխակերպում…','busy');
      if(!window.kmNative||!window.kmNative.convert||!window.kmNative.convert.folder)throw new Error('Native փոխակերպման համակարգը հասանելի չէ։');
      if(window.kmNative.convert.onProgress){
        unsub=window.kmNative.convert.onProgress(function(ev){
          if(!ev)return;
          status('Պանակ՝ '+(ev.index||0)+' / '+(ev.total||0)+(ev.name?' · '+ev.name:''),'busy');
        });
      }
      var r=await window.kmNative.convert.folder({kind:kind});
      if(r&&r.cancelled){status('Չեղարկվեց։');return;}
      lastConvertOutput=(r&&r.folder)||'';
      var fail=r&&r.failed?r.failed:0;
      status('Պանակ՝ '+((r&&r.done)||0)+' / '+((r&&r.total)||0)+(fail?' · ձախողում՝ '+fail:''),'ok');
      setResultActions(!!lastConvertOutput);
    }catch(e){
      lastConvertOutput='';
      setResultActions(false);
      status(e.message||'Փոխակերպման սխալ։','error');
    }finally{
      if(typeof unsub==='function')unsub();
    }
  };

  window.kmBindConverterDrops=function(){
    document.querySelectorAll('.converterBox').forEach(function(box){
      if(box.__kmDrop)return;
      var input=box.querySelector('input[type=file]');
      if(!input)return;
      box.__kmDrop=true;
      box.addEventListener('dragover',function(e){e.preventDefault();box.classList.add('kmDropHover');});
      box.addEventListener('dragleave',function(){box.classList.remove('kmDropHover');});
      box.addEventListener('drop',function(e){
        e.preventDefault();
        box.classList.remove('kmDropHover');
        var files=e.dataTransfer&&e.dataTransfer.files;
        if(!files||!files.length)return;
        try{
          var dt=new DataTransfer();
          var max=input.multiple?files.length:1;
          for(var i=0;i<max;i++)dt.items.add(files[i]);
          input.files=dt.files;
        }catch(err){}
        var btn=box.querySelector('button[onclick]');
        if(btn)btn.click();
      });
    });
  };

  window.kmShowLastConvert=async function(){
    if(!lastConvertOutput||!window.kmNative||!window.kmNative.shell)return;
    try{await window.kmNative.shell.showItemInFolder(lastConvertOutput);}catch(e){status(e.message||'Չհաջողվեց բացել թղթապանակը։','error');}
  };

  window.kmOpenLastConvert=async function(){
    if(!lastConvertOutput||!window.kmNative||!window.kmNative.shell)return;
    try{
      var r=await window.kmNative.shell.openPath(lastConvertOutput);
      if(r&&!r.ok)throw new Error(r.error||'Չհաջողվեց բացել ֆայլը։');
    }catch(e){status(e.message||'Չհաջողվեց բացել ֆայլը։','error');}
  };
})();
</script>

<script id="KM-aah-rank-helper">
(function(){
  window.formatAAH=function(name){
    var parts=String(name||'').trim().split(/\s+/).filter(Boolean);
    if(parts.length<=2)return '<span class="aahLine1">'+parts.map(escapeAAH).join(' ')+'</span>';
    return '<span class="aahLine1">'+escapeAAH(parts[0]+' '+parts[1])+'</span><span class="aahLine2">'+escapeAAH(parts.slice(2).join(' '))+'</span>';
  };
  function escapeAAH(v){
    return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
  }
})();
</script>

<script id="KM-file-macros-v1">
(function(){
  'use strict';

  var MLIB={jszip:'vendor/jszip.min.js'};
  var lastMacroOutput='';
  var lastMacroLabOutput='';

  function mstatus(msg,type){
    var el=document.getElementById('macroStatus');
    if(!el)return;
    if(typeof kmTranslateUI==='function')msg=kmTranslateUI(msg);
    el.textContent=msg;
    el.className='converterStatus'+(type?' '+type:'');
  }

  function setMacroActions(show){
    var bar=document.getElementById('macroResultActions');
    if(bar)bar.style.display=show?'flex':'none';
  }

  function setMacroLabActions(show){
    var bar=document.getElementById('macroLabResultActions');
    if(bar)bar.style.display=show?'flex':'none';
  }

  function showMacroResult(r){
    lastMacroOutput=(r&&(r.output||r.path))||'';
    var size=r&&r.size?(' ('+Math.round(r.size/1024)+' KB)'):'';
    mstatus('Պատրաստ է՝ '+lastMacroOutput+size,'ok');
    setMacroActions(!!lastMacroOutput);
  }

  function showMacroLabResult(r){
    lastMacroLabOutput=(r&&(r.output||r.path))||'';
    var size=r&&r.size?(' ('+Math.round(r.size/1024)+' KB)'):'';
    var el=document.getElementById('macroLabStatus');
    if(el){
      el.textContent='Պատրաստ է՝ '+lastMacroLabOutput+size;
      el.className='converterStatus ok';
    }
    setMacroLabActions(!!lastMacroLabOutput);
  }

  function loadLib(src,globalName){
    return new Promise(function(resolve,reject){
      if(globalName&&window[globalName]){resolve(window[globalName]);return;}
      var old=document.querySelector('script[data-macro-lib="'+src+'"]');
      if(old){
        old.addEventListener('load',function(){resolve(globalName?window[globalName]:true);},{once:true});
        old.addEventListener('error',function(){reject(new Error('Գրադարանը չի բեռնվել։'));},{once:true});
        return;
      }
      var s=document.createElement('script');
      s.src=src;s.async=true;s.dataset.macroLib=src;
      s.onload=function(){resolve(globalName?window[globalName]:true);};
      s.onerror=function(){reject(new Error('Չհաջողվեց բեռնել մակրոսի գրադարանը։'));};
      document.head.appendChild(s);
    });
  }

  async function needZip(){await loadLib(MLIB.jszip,'JSZip');}
  window.needZip=needZip;
  window.loadLib=loadLib;

  window.updateMacroFields=function(){
    var action=document.getElementById('macroAction')?.value||'normalize';
    var show=action==='replace';
    var a=document.getElementById('macroFindWrap');
    var b=document.getElementById('macroReplaceWrap');
    if(a)a.style.display=show?'flex':'none';
    if(b)b.style.display=show?'flex':'none';
  };

  function stem(name){return String(name||'file').replace(/\.[^.]+$/,'')||'file';}
  function ext(name){var m=/\.([^.]+)$/.exec(String(name||''));return m?m[1].toLowerCase():'';}

  function transformText(value,action,find,replace){
    var s=String(value==null?'':value);
    if(action==='replace')return find?s.split(find).join(replace):s;
    if(action==='upper')return s.toUpperCase();
    if(action==='lower')return s.toLowerCase();
    if(action==='trim')return s.trim();
    if(action==='normalize')return s.replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').trim();
    return s;
  }

  async function saveBlobToDesktop(blob,outName){
    if(window.kmNative&&window.kmNative.file&&window.kmNative.file.writeDesktop){
      var bytes=new Uint8Array(await blob.arrayBuffer());
      var r=await window.kmNative.file.writeDesktop({name:outName,bytes:bytes});
      if(!r||!r.ok||!r.path)throw new Error('Desktop-ում պահպանել չհաջողվեց։');
      return {ok:true,output:r.path,folder:r.folder,size:r.size||bytes.length};
    }
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=outName;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1500);
    return {ok:true,output:outName,size:blob.size||0};
  }

  window.kmNativeMacroRequest=async function(request,file){
    if(!window.kmNative||!window.kmNative.macro)throw new Error('Native մակրոսի համակարգը հասանելի չէ։');
    if(!file)throw new Error('Նախ ընտրիր ֆայլը։');
    var bytes=new Uint8Array(await file.arrayBuffer());
    request.name=file.name;request.bytes=bytes;
    var r=await window.kmNative.macro.run(request);
    return {ok:true,output:r.output,folder:r.folder,size:r.size};
  };

  window.kmShowMacroOutput=async function(){
    if(!lastMacroOutput||!window.kmNative||!window.kmNative.shell)return;
    try{await window.kmNative.shell.showItemInFolder(lastMacroOutput);}catch(e){mstatus(e.message||'Չհաջողվեց բացել թղթապանակը։','error');}
  };

  window.kmOpenMacroOutput=async function(){
    if(!lastMacroOutput||!window.kmNative||!window.kmNative.shell)return;
    try{
      var r=await window.kmNative.shell.openPath(lastMacroOutput);
      if(r&&!r.ok)throw new Error(r.error||'Չհաջողվեց բացել ֆայլը։');
    }catch(e){mstatus(e.message||'Չհաջողվեց բացել ֆայլը։','error');}
  };

  window.kmShowMacroLabOutput=async function(){
    if(!lastMacroLabOutput||!window.kmNative||!window.kmNative.shell)return;
    try{await window.kmNative.shell.showItemInFolder(lastMacroLabOutput);}catch(e){
      var el=document.getElementById('macroLabStatus');if(el){el.textContent=e.message||'Չհաջողվեց բացել թղթապանակը։';el.className='converterStatus error';}
    }
  };

  window.kmOpenMacroLabOutput=async function(){
    if(!lastMacroLabOutput||!window.kmNative||!window.kmNative.shell)return;
    try{
      var r=await window.kmNative.shell.openPath(lastMacroLabOutput);
      if(r&&!r.ok)throw new Error(r.error||'Չհաջողվեց բացել ֆայլը։');
    }catch(e){
      var el=document.getElementById('macroLabStatus');if(el){el.textContent=e.message||'Չհաջողվեց բացել ֆայլը։';el.className='converterStatus error';}
    }
  };

  async function macroDocx(file,action,find,replace){
    await needZip();
    var zip=await JSZip.loadAsync(await file.arrayBuffer());
    var targets=Object.keys(zip.files).filter(function(n){
      return /^word\/(document|header\d*|footer\d*|footnotes|endnotes|comments)\.xml$/i.test(n);
    });
    for(var i=0;i<targets.length;i++){
      var name=targets[i];
      var xml=await zip.file(name).async('string');
      var doc=new DOMParser().parseFromString(xml,'application/xml');
      var nodes=doc.getElementsByTagNameNS('*','t');
      for(var j=0;j<nodes.length;j++){
        nodes[j].textContent=transformText(nodes[j].textContent,action,find,replace);
      }
      zip.file(name,new XMLSerializer().serializeToString(doc));
    }
    var blob=await zip.generateAsync({
      type:'blob',
      mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
    return saveBlobToDesktop(blob,stem(file.name)+'_'+Date.now().toString().slice(0,13)+'_macro.docx');
  }

  window.runKMMacro=async function(){
    try{
      var input=document.getElementById('macroFile'),file=input&&input.files&&input.files[0];
      if(!file)throw new Error('Նախ ընտրիր Word, Excel կամ PDF ֆայլը։');
      var action=document.getElementById('macroAction')?.value||'normalize';
      var find=document.getElementById('macroFind')?.value||'';
      var replace=document.getElementById('macroReplace')?.value||'';
      if(action==='replace'&&!find)throw new Error('«Փնտրել» դաշտը դատարկ է։');
      var e=ext(file.name);
      lastMacroOutput='';
      setMacroActions(false);
      mstatus('Մակրոսը կատարվում է…','busy');
      var r;
      if(e==='docx'){
        if(action==='removeEmptyRows')throw new Error('«Դատարկ տողերը հեռացնել» մակրոսը միայն Excel-ի համար է։');
        r=await macroDocx(file,action,find,replace);
      }else if(e==='doc'||e==='xlsx'||e==='xls'||e==='pdf'){
        r=await window.kmNativeMacroRequest({mode:'macro',action:action,find:find,replace:replace},file);
      }else throw new Error('Աջակցվում են .doc, .docx, .xlsx/.xls և .pdf ֆայլերը։');
      showMacroResult(r);
    }catch(e){
      console.error('KM macro',e);
      lastMacroOutput='';
      setMacroActions(false);
      mstatus(e.message||'Մակրոսի կատարման սխալ։','error');
    }
  };

  document.addEventListener('DOMContentLoaded',function(){
    try{updateMacroFields();}catch(e){}
  });

  window.kmSaveBlobToDesktop=saveBlobToDesktop;
  window.kmShowMacroLabResult=showMacroLabResult;
  window.kmSetMacroLabBusy=function(msg){
    lastMacroLabOutput='';
    setMacroLabActions(false);
    var el=document.getElementById('macroLabStatus');
    if(el){el.textContent=msg;el.className='converterStatus busy';}
  };
})();
</script>
