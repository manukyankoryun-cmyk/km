<script id="km-core-dialog-helpers">
window.kmOpenDialog=function(title,bodyHtml,onSave,saveText='Պահպանել'){
  document.getElementById('kmCoreDialog')?.remove();
  const o=document.createElement('div');o.id='kmCoreDialog';o.className='kmDlgOverlay';
  o.innerHTML=`<div class="kmDlgCard"><div class="kmDlgHead"><h3>${title}</h3><button type="button" id="kmDlgX" class="kmDlgClose">×</button></div>
  <div id="kmDlgBody">${bodyHtml}</div><div id="kmDlgError" class="kmDlgError"></div>
  <div class="kmDlgActions"><button type="button" id="kmDlgCancel">Չեղարկել</button><button type="button" id="kmDlgSave" class="primary">${saveText}</button></div></div>`;
  document.body.appendChild(o);
  if(typeof window.kmForceUiPaint==='function')window.kmForceUiPaint(o);
  const close=()=>{ try{ o.remove(); }catch(e){} };
  const isTypingField=function(el){
    if(!el||el===o)return false;
    const tag=String(el.tagName||'').toUpperCase();
    if(tag==='TEXTAREA')return true;
    if(tag==='SELECT')return false;
    if(tag==='INPUT'){
      const t=String(el.type||'text').toLowerCase();
      return t!=='button'&&t!=='submit'&&t!=='checkbox'&&t!=='radio'&&t!=='file';
    }
    return !!el.isContentEditable;
  };
  const confirmDlg=async function(){
    const btn=o.querySelector('#kmDlgSave');
    if(!btn||btn.disabled)return;
    if(typeof onSave!=='function'){ close(); return; }
    try{
      const ok=await onSave(o);
      if(ok!==false)close();
    }catch(e){
      const m=String(e?.message||e||'');
      const err=o.querySelector('#kmDlgError');
      if(err)err.textContent=(typeof kmTranslateUI==='function'?kmTranslateUI(m):m);
    }
  };
  o.querySelector('#kmDlgX').onclick=close;
  o.querySelector('#kmDlgCancel').onclick=close;
  o.querySelector('#kmDlgSave').onclick=confirmDlg;
  o.addEventListener('mousedown',e=>{if(e.target===o)close()});
  o.addEventListener('keydown',function(ev){
    const k=String(ev.key||'');
    if(k==='Escape'){ ev.preventDefault(); ev.stopPropagation(); close(); return; }
    if(k!=='Enter'||ev.ctrlKey||ev.metaKey||ev.altKey)return;
    if(isTypingField(ev.target)&&String(ev.target.tagName||'').toUpperCase()==='TEXTAREA')return;
    ev.preventDefault();
    ev.stopPropagation();
    confirmDlg();
  });
  if(typeof kmApplyLanguage==='function')try{kmApplyLanguage();}catch(e){}
  setTimeout(function(){
    try{
      const first=o.querySelector('#kmDlgBody input:not([type=hidden]):not([disabled]),#kmDlgBody textarea:not([disabled]),#kmDlgBody select:not([disabled])');
      if(first)first.focus();
      else o.querySelector('#kmDlgSave')?.focus();
    }catch(eF){}
  },0);
  return o;
};
window.kmEscHtml=function(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};
</script>

<script id="km-force-paint-js">
window.kmForceUiPaint=function(root){
  /* KM_UI_SMOOTH_V1: do not walk every input/span — that freezes Unit Archive scroll */
  try{
    if(window.__kmSkipUiPaint) return;
    var now=Date.now();
    if(now-(window.__kmForcePaintAt||0)<180) return;
    window.__kmForcePaintAt=now;
    var el=!root?document.body:(root.nodeType?root:document.querySelector(root));
    if(!el)return;
    el.classList.add('km-ui-painted');
    void el.offsetWidth;
  }catch(e){}
};
window.kmKickUiPaint=function(root){
  var el=root&&root.nodeType?root:(document.getElementById('content')||document.body);
  if(typeof window.kmForceUiPaint==='function')window.kmForceUiPaint(el);
};
(function(){
  var sel='#kmLoginOverlay,#kmLicenseGate,#kmCoreDialog,#kmPosModal,#kmExtModal,.kmDlgOverlay,.kmModalOverlay,.kmPosModal,.modal,.kmPrintPreviewOverlay,.kmArchiveReadonlyOverlay';
  function hook(node){
    if(!node||node.nodeType!==1)return;
    try{
      if(node.matches&&node.matches(sel))window.kmForceUiPaint(node);
    }catch(eM){}
  }
  function start(){
    if(!document.body||document.body.__kmPaintObs)return;
    document.body.__kmPaintObs=true;
    var mo=new MutationObserver(function(ms){
      for(var i=0;i<ms.length;i++){
        var add=ms[i].addedNodes;
        for(var j=0;j<add.length;j++)hook(add[j]);
      }
    });
    mo.observe(document.body,{childList:true});
    var content=document.getElementById('content');
    if(content&&!content.__kmPaintObs){
      content.__kmPaintObs=true;
      var cmo=new MutationObserver(function(){
        if(window.__kmSkipUiPaint) return;
        if(window.__kmPaintContentT) return;
        window.__kmPaintContentT=setTimeout(function(){
          window.__kmPaintContentT=0;
          if(window.__kmSkipUiPaint) return;
          window.kmForceUiPaint(content);
        },160);
      });
      cmo.observe(content,{childList:true});
    }
    document.addEventListener('visibilitychange',function(){
      if(document.hidden)return;
      var paintRoot=document.getElementById('dutyTypePlanningModal')||document.getElementById('content');
      if(typeof window.kmKickUiPaint==='function')window.kmKickUiPaint(paintRoot);
    });
  }
  if(document.body)start();
  else document.addEventListener('DOMContentLoaded',start);
})();
</script>

function kmStripArchiveBinary(list){
  if(!Array.isArray(list)) return list||[];
  var out=new Array(list.length);
  for(var i=0;i<list.length;i++){
    var a=list[i];
    if(!a||typeof a!=='object'||!a.base64){ out[i]=a; continue; }
    var o={};
    for(var k in a){ if(Object.prototype.hasOwnProperty.call(a,k)&&k!=='base64') o[k]=a[k]; }
    o._excelKept=true;
    o._excelBytes=String(a.base64).length;
    out[i]=o;
  }
  return out;
}
function kmSlimDbForPersist(src, opts){ /* KM_FREEZE_ROOT_V2_SLIM */
  opts=opts||{};
  src=src||db;
  if(!src||typeof src!=='object') return src;
  var slim=Object.assign({},src);
  slim.positionArchives=kmStripArchiveBinary(src.positionArchives);
  var dropFormal=!!opts.dropFormal;
  if(dropFormal){
    /* light graph saves: omit 2000+ formal rows from IDB put */
    slim.unitFormalArchives={};
  }
  if(src.kmCorpsData&&typeof src.kmCorpsData==='object'&&!Array.isArray(src.kmCorpsData)){
    slim.kmCorpsData={};
    Object.keys(src.kmCorpsData).forEach(function(key){
      var sl=src.kmCorpsData[key];
      if(!sl||typeof sl!=='object'){ slim.kmCorpsData[key]=sl; return; }
      var copy=Object.assign({},sl);
      copy.positionArchives=kmStripArchiveBinary(sl.positionArchives);
      if(dropFormal) copy.unitFormalArchives={};
      slim.kmCorpsData[key]=copy;
    });
  }
  return slim;
}

function kmFreezeRootBoot(){ /* KM_FREEZE_ROOT_V2_BOOT */
  try{
    if(typeof db==='undefined'||!db) return;
    var max=Number(window.KM_GRAPH_MAX_PEOPLE)||5000;
    var cleared=0;
    function clamp(sch){
      /* KM_FREEZE_ROOT_V5_NO_WIPE — this used to hard-delete: sch.selectedPeople=[] and
         sch.assignments={} for ANY duty type with more than `max` people, on EVERY app start.
         That silently destroyed a saved, already-built duty roster and its assignments the next
         time the program was opened, for any duty type with more than 60 people selected — even
         though nothing was wrong with the data. It now keeps the first `max` people (same rule
         used everywhere else in this app) and only drops assignment rows for the people that no
         longer fit, instead of deleting everything. */
      if(!sch||typeof sch!=='object') return;
      if(!Array.isArray(sch.selectedPeople)) sch.selectedPeople=[];
      if(sch.selectedPeople.length>max){
        cleared += (sch.selectedPeople.length-max);
        sch.selectedPeople=sch.selectedPeople.slice(0,max);
        if(sch.assignments && typeof sch.assignments==='object'){
          var keep={}; sch.selectedPeople.forEach(function(n){ keep[String(n)]=1; });
          Object.keys(sch.assignments).forEach(function(k){ if(!keep[String(k)]) delete sch.assignments[k]; });
        }
      }
    }
    clamp(db.schedule);
    Object.keys(db.dutyTypeSchedules||{}).forEach(function(k){ clamp(db.dutyTypeSchedules[k]); });
    try{
      Object.keys(db.kmCorpsData||{}).forEach(function(cid){
        var sl=db.kmCorpsData[cid];
        if(!sl) return;
        clamp(sl.schedule);
        Object.keys(sl.dutyTypeSchedules||{}).forEach(function(k){ clamp(sl.dutyTypeSchedules[k]); });
      });
    }catch(_c){}
    window.__kmFreezeRootV2=true;
    /* KM_V7_STATUS_TOAST_REMOVED — no bottom-right status chip */
    
    /* KM_FREEZE_ROOT_V4_NO_BOOT_SAVE — boot save caused hang with formalRows */
  }catch(e){ console.warn('kmFreezeRootBoot', e); }
}

(function(){
  function bindFly(block){
    if(!block||block._kmFlyBound) return;
    block._kmFlyBound=true;
    function keepOpen(){
      if(!document.body.classList.contains('km-role-user')) return;
      window.kmOpenFlyMenu(block);
    }
    function scheduleClose(ev){
      if(!document.body.classList.contains('km-role-user')) return;
      var to=ev&&ev.relatedTarget;
      if(to&&block.contains(to)) return;
      window.kmCancelFlyClose();
      window._kmFlyCloseTimer=setTimeout(function(){
        if(block.matches(':hover')) return;
        var panel=block.querySelector('.kmFlyPanel');
        if(panel&&panel.matches(':hover')) return;
        block.classList.remove('km-fly-open');
      },450);
    }
    block.addEventListener('mouseenter',keepOpen);
    block.addEventListener('mouseleave',scheduleClose);
    var panel=block.querySelector('.kmFlyPanel');
    if(panel){
      panel.addEventListener('mouseenter',keepOpen);
      panel.addEventListener('mouseleave',scheduleClose);
    }
    var title=block.querySelector('.kmFlyTitle');
    if(title){
      title.addEventListener('click',function(ev){
        if(!document.body.classList.contains('km-role-user')) return;
        ev.preventDefault();
        ev.stopPropagation();
        if(block.classList.contains('km-fly-open')) window.kmCloseFlyMenus();
        else window.kmOpenFlyMenu(block);
      });
    }
  }
  bindFly(document.getElementById('kmLibMenuBlock'));
  bindFly(document.getElementById('kmUserMenuBlock'));
  document.addEventListener('click',function(ev){
    if(!ev.target||!ev.target.closest) return;
    if(ev.target.closest('.kmFlyBlock')||ev.target.closest('.kmFlyPanel')) return;
    window.kmCloseFlyMenus();
  });
})();

function kmPersonIsBlocked(p){

/** Թափուր պաշտոնի քարտի stub — գրաֆիկում չպլանավորվող */
function kmPersonIsVacantStub(p){
  if(!p)return false;
  if(p._kmVacantPosId)return true;
  return kmPersonNameIsVacantStub(p.name||p.fullName||p.person);
}
function kmPersonNameIsVacantStub(name){
  const n=String(name||'').trim();
  if(!n)return false;
  if(/^[【\[]\s*թափուր/i.test(n)) return true;
  if(/\bթափուր\b/i.test(n) && /[0-9a-z]{2,}_[0-9a-z]{2,}/i.test(n)) return true;
  try{
    const p=(((window.db||db)||{}).people||[]).find(x=>String(x&&x.name||'').trim()===n);
    if(p&&p._kmVacantPosId)return true;
  }catch(e){}
  return false;
}
function kmPersonNotPlannable(p){
  if(!p)return true;
  if(kmPersonIsVacantStub(p))return true;
  if(kmPersonIsBlocked(p))return true;
  try{
    if(window.kmOpsLogic&&typeof kmOpsLogic.personContractEnded==='function'){
      return !!kmOpsLogic.personContractEnded(p,new Date());
    }
  }catch(e){}
  return false;
}
function kmPurgeVacantStubsFromGraphs(){
  const data=(window.db||db);
  if(!data)return;
  const dropNames=new Set();
  (data.people||[]).forEach(p=>{
    if(kmPersonIsVacantStub(p)){
      p.blocked=true;
      const n=kmPersonDisplayName(p);
      if(n)dropNames.add(n);
    }
  });
  const drop=n=>!kmPersonNameIsVacantStub(n)&&!dropNames.has(String(n||'').trim());
  if(Array.isArray(data.schedule?.selectedPeople)){
    data.schedule.selectedPeople=data.schedule.selectedPeople.filter(drop);
  }
  Object.values(data.dutyTypeSchedules||{}).forEach(sch=>{
    if(!sch||typeof sch!=='object')return;
    if(Array.isArray(sch.selectedPeople))sch.selectedPeople=sch.selectedPeople.filter(drop);
    dropNames.forEach(name=>{
      if(sch.assignments&&Object.prototype.hasOwnProperty.call(sch.assignments,name))delete sch.assignments[name];
      if(sch.rows&&Object.prototype.hasOwnProperty.call(sch.rows,name))delete sch.rows[name];
    });
    Object.keys(sch.assignments||{}).forEach(k=>{if(kmPersonNameIsVacantStub(k))delete sch.assignments[k];});
    Object.keys(sch.rows||{}).forEach(k=>{if(kmPersonNameIsVacantStub(k))delete sch.rows[k];});
  });
  (data.futureSchedules||[]).forEach(fs=>{
    if(Array.isArray(fs?.selectedPeople))fs.selectedPeople=fs.selectedPeople.filter(drop);
  });
  dropNames.forEach(name=>{
    if(typeof kmRemovePersonFromAllSchedules==='function')kmRemovePersonFromAllSchedules(name);
  });
  Object.keys(data.schedule?.rows||{}).forEach(k=>{
    if(kmPersonNameIsVacantStub(k))delete data.schedule.rows[k];
  });
}
function kmRemovePersonFromAllSchedules(name){
  name=String(name||'').trim();if(!name)return;

  // Main schedule.
  if(db.schedule?.rows && Object.prototype.hasOwnProperty.call(db.schedule.rows,name)){
    delete db.schedule.rows[name];
  }

  // Every duty-type schedule.
  if(db.dutyTypeSchedules && typeof db.dutyTypeSchedules==='object'){
    Object.values(db.dutyTypeSchedules).forEach(sch=>{
      if(!sch||typeof sch!=='object')return;
      if(sch.assignments && Object.prototype.hasOwnProperty.call(sch.assignments,name)){
        delete sch.assignments[name];
      }
      if(sch.rows && Object.prototype.hasOwnProperty.call(sch.rows,name)){
        delete sch.rows[name];
      }
    });
  }
}
function kmEnsurePersonInSchedules(name){
  name=String(name||'').trim();if(!name)return;
  if(typeof kmNameIsUsablePerson==='function'&&!kmNameIsUsablePerson(name))return;
  db.schedule=db.schedule||{};db.schedule.rows=db.schedule.rows||{};
  const mainSel=Array.isArray(db.schedule.selectedPeople)?db.schedule.selectedPeople:[];
  if(mainSel.some(n=>String(n||'').trim()===name)){
    db.schedule.rows[name]=db.schedule.rows[name]||{};
  }

  if(db.dutyTypeSchedules && typeof db.dutyTypeSchedules==='object'){
    Object.values(db.dutyTypeSchedules).forEach(sch=>{
      if(!sch||typeof sch!=='object')return;
      const sel=Array.isArray(sch.selectedPeople)?sch.selectedPeople:[];
      if(!sel.some(n=>String(n||'').trim()===name))return;
      sch.assignments=sch.assignments||{};
      sch.assignments[name]=sch.assignments[name]||{};
    });
  }
}
async function togglePersonBlocked(i){
  const p=db.people?.[i];if(!p)return;
  if(kmPersonIsVacantStub(p)){
    p.blocked=true;
    p.active=false;
    kmRemovePersonFromAllSchedules(kmPersonDisplayName(p));
    kmRemoveFromSelectedPeople(kmPersonDisplayName(p));
    await save(true);
    render();
    toast('Թափուր պաշտոնի քարտը գրաֆիկում չի պլանավորվում','warn');
    return;
  }
  const willBlock=!kmPersonIsBlocked(p);

  p.blocked=willBlock;
  p.active=!willBlock;

  if(willBlock){
    kmRemovePersonFromAllSchedules(kmPersonDisplayName(p));
    kmRemoveFromSelectedPeople(kmPersonDisplayName(p));
  }else{
    kmEnsurePersonInSchedules(kmPersonDisplayName(p));
  }

  await save(true);
  render();
  toast(willBlock
    ? `${p.name} — արգելափակված է և հեռացված է բոլոր գրաֆիկներից`
    : `${p.name} — ապաարգելափակված է`);
}

function kmTelHref(phone){
  let d=String(phone||'').replace(/[^\d+]/g,'');
  if(!d)return '';
  if(d.indexOf('00')===0)d='+'+d.slice(2);
  if(/^0\d{8,}$/.test(d))d='+374'+d.slice(1);
  if(/^374\d/.test(d)&&d.charAt(0)!=='+')d='+'+d;
  return 'tel:'+d;
}
function kmCallCellHtml(phone){

}

function people(){

    if(typeof window.kmUnitHasStaffSource==='function'? !window.kmUnitHasStaffSource() : (typeof window.kmUnitHasStaffSource==='function'? !window.kmUnitHasStaffSource() : (typeof window.kmUnitHasExcelArchive==='function'&&!window.kmUnitHasExcelArchive()))){

      const hay=[p.name,typeof kmRankText==='function'?kmRankText(p.rank):p.rank,p.unit,p.phone].map(function(x){return String(x||'').toLowerCase();}).join(' ');

  const total=list.length;

  const page=window.kmPeoplePage;

    const i=personIndexInDb(p);

  </tr>`;
  }).join('')||'<tr><td colspan="6" class="muted" style="padding:12px">'+(q?'Որոնման արդյունք չկա':'Անձնակազմ չկա')+'</td></tr>';

const RANKS=['շ-ն','կրտ․ս-տ','ս-տ','ավ․ս-տ','ավագ','հդ ս-տ','ենթասպա','ավագ ենթասպա','հվ ս-տ','հգմ -ս-տ','գնդի սերժանտ','կորպուսի սերժանտ','լ-տ','ավ․լ-տ','կ-ն','մ-ր','փ/գ-տ','գ-տ','գեներալ'];

function syncPersonNameEverywhere(oldName,newName){
  oldName=String(oldName||'').trim();
  newName=String(newName||'').trim();
  if(!oldName||!newName||oldName===newName)return;

  // Հիմնական գրաֆիկ
  if(db.schedule&&db.schedule.rows&&Object.prototype.hasOwnProperty.call(db.schedule.rows,oldName)){
    if(!db.schedule.rows[newName])db.schedule.rows[newName]={};
    Object.assign(db.schedule.rows[newName],db.schedule.rows[oldName]||{});
    delete db.schedule.rows[oldName];
  }
  if(Array.isArray(db.schedule?.selectedPeople)){
    db.schedule.selectedPeople=db.schedule.selectedPeople.map(n=>String(n).trim()===oldName?newName:String(n).trim()).filter(Boolean);
  }

  // Վերակարգերի տեսակներ
  if(db.dutyTypeSchedules&&typeof db.dutyTypeSchedules==='object'){
    Object.values(db.dutyTypeSchedules).forEach(sch=>{
      if(!sch||!sch.assignments||typeof sch.assignments!=='object')return;
      if(Object.prototype.hasOwnProperty.call(sch.assignments,oldName)){
        if(!sch.assignments[newName])sch.assignments[newName]={};
        Object.assign(sch.assignments[newName],sch.assignments[oldName]||{});
        delete sch.assignments[oldName];
      }
    });
  }

  // Արձակուրդ
  if(Array.isArray(db.vacations)){
    db.vacations.forEach(v=>{if(v&&v.person===oldName)v.person=newName;});
  }

  // Գրանցումներ
  if(Array.isArray(db.registrations)){
    db.registrations.forEach(r=>{if(r&&r.person===oldName)r.person=newName;});
  }

  if(Array.isArray(db.notebookNotes)){
    db.notebookNotes.forEach(n=>{if(n&&n.person===oldName)n.person=newName;});
  }
}

function bindPeople(){
  content.querySelectorAll('[data-p]').forEach(x=>x.onchange=()=>{
    let p=db.people[+x.dataset.p];if(!p)return;
    let key=x.dataset.k;
    let prev=String(p[key]||'').trim();
    let next='';
    if(key==='name'){
      let oldName=String(p.name||'').trim();
      let newName=String(x.value||'').trim();
      if(!newName){x.value=oldName;return;}
      syncPersonNameEverywhere(oldName,newName);
      p.name=newName;x.value=newName;
      prev=oldName;next=newName;
    }else if(key==='phone'){
      p.phone=String(x.value||'').trim();
      x.value=p.phone;
      next=p.phone;
      const cell=x.closest('tr')?.querySelector('.kmCallCell');
      if(cell)cell.innerHTML=kmCallCellHtml(p.phone);
    }else{
      p[key]=x.value;
      next=String(x.value||'').trim();
    }
    if(typeof window.kmHishoxutyunLog==='function' && prev!==next){
      const fieldHy={name:'Ա․Ա․Հ․',rank:'Կոչում',unit:'Ստորաբաժանում',phone:'Հեռախոս'}[key]||key;
      let bit='';
      if(!prev && next) bit='ավելացրել է «'+fieldHy+'»՝ '+next;
      else if(prev && !next) bit='հանել է «'+fieldHy+'»՝ '+prev;
      else bit='փոխել է «'+fieldHy+'»՝ «'+prev+'» → «'+next+'»';
      window.kmHishoxutyunLog({
        section:'people',
        sectionLabel:'Անձնակազմ և քարտ',
        action:'change',
        detail:'Անձնակազմ՝ '+(p.name||'')+' · '+bit
      });
    }
    save(true);
  });
}

:'ավ․լ-տ'};
function kmNormalizeRank(v){
  let s=String(v||'').trim().replace(/[\u2010-\u2015\u2212\u058A]/g,'-').replace(/\s+/g,' ');
  /* Հեռացնել (Պ)/(պ)/(P) և նման նշումները */
  s=s.replace(/\s*[\(\[\{]\s*[ՊպPp]\s*[\)\]\}]\s*/g,' ').replace(/\s+/g,' ').trim();
  s=s.replace(/\.+/g,'.').replace(/\s*\.\s*/g,'. ').replace(/\s+/g,' ').trim();
  s=s.replace(/\.\s*$/,'');
  if(/^շարք/i.test(s)||/^շարք\./i.test(s)||s==='շարք.')s='շ-ն';
  if(KM_LEGACY_RANK_MAP[s])return KM_LEGACY_RANK_MAP[s];
  const compact=s.replace(/\s+/g,'');
  if(KM_LEGACY_RANK_MAP[compact])return KM_LEGACY_RANK_MAP[compact];
  const low=s.toLowerCase();
  const hit=KM_FINAL_RANKS.find(r=>r.toLowerCase()===low);
  if(hit)return hit;
  const compactLow=compact.toLowerCase();
  const hit2=KM_FINAL_RANKS.find(r=>r.replace(/\s+/g,'').toLowerCase()===compactLow);
  if(hit2)return hit2;
  /* ավ.լ-տ / ավ լ-տ */
  if(/^ավ\.?\s*լ-?տ$/i.test(s)||/^ավլ-?տ$/i.test(compactLow))return 'ավ․լ-տ';
  if(/^կրտ\.?\s*ս-?տ$/i.test(s))return 'կրտ․ս-տ';
  if(/^ավ\.?\s*ս-?տ$/i.test(s))return 'ավ․ս-տ';
  if(/^ս-?տ$/i.test(s)||/^սերժ/i.test(s))return 'ս-տ';
  if(/^լ-?տ$/i.test(s))return 'լ-տ';
  if(/^կ-?ն$/i.test(s)||/^կապիտ/i.test(s))return 'կ-ն';
  if(/^մ-?ր$/i.test(s)||/^մայոր/i.test(s))return 'մ-ր';
  if(/^փ\/?գ-?տ$/i.test(s)||/^փոխգնդ/i.test(s))return 'փ/գ-տ';
  if(/^գեներալ/i.test(s)||/^գեն\.?$/i.test(s)||/^գեն$/i.test(compactLow))return 'գեներալ';
  if(/^գ-?տ$/i.test(s)||/^գնդապետ/i.test(s))return 'գ-տ';
  if(/^շ-?ն$/i.test(s))return 'շ-ն';
  if(/^ավագ\s*ենթասպա$/i.test(s)||/^ավ\.\s*ենթասպա$/i.test(s))return 'ավագ ենթասպա';
  if(/^ենթասպա$/i.test(s))return 'հդ ս-տ';
  return s;
}
/** Rank index in KM_FINAL_RANKS (low→high). Unknown ranks sort at bottom (after high→low). */
function kmRankSortIndex(rank){
  const i=KM_FINAL_RANKS.indexOf(kmNormalizeRank(rank));
  return i>=0?i:-1;
}
/** Graph row order: գ-տ, փ/գ-տ, մ-ր, կ-ն … (higher rank first). */
function kmSortPeopleByRank(people){
  return (people||[]).slice().sort((a,b)=>{
    const ra=kmRankSortIndex(a&&a.rank), rb=kmRankSortIndex(b&&b.rank);
    if(ra!==rb)return rb-ra;
    return kmPersonDisplayName(a).localeCompare(kmPersonDisplayName(b),'hy');
  });
}
function kmNormalizeAllStoredRanks(){

}

function kmRenamePersonInGraphs(oldName,newName){

  const data=(window.db||db);

    if(!Array.isArray(list))return;

    }
  };
  fix(data.schedule&&data.schedule.selectedPeople);

    if(!sch||typeof sch!=='object')return;
    fix(sch.selectedPeople);

      delete sch.assignments[oldName];

      delete sch.rows[oldName];
    }
  });

    if(!fs||typeof fs!=='object')return;
    fix(fs.selectedPeople);
  });
}

function kmHealPeopleNamesFromArchive(force){
  const data=(window.db||(typeof db!=='undefined'?db:null));
  if(!data||!Array.isArray(data.people)||!data.people.length)return 0;
  if(!force&&window._kmNamesHealedAt&&(Date.now()-window._kmNamesHealedAt)<4000)return 0;
  let rows=[];
  try{
    if(typeof window.kmAllPositionArchiveRows==='function')rows=window.kmAllPositionArchiveRows()||[];
  }catch(e0){rows=[];}
  if(!rows.length)return 0;
  window._kmNamesHealedAt=Date.now();
  const unused=[];
  const seenArch=Object.create(null);
  rows.forEach(r=>{
    if(!r||r.type==='section')return;
    const n=String(r.sourceName||r.name||'').replace(/\s+/g,' ').trim();
    if(!n||kmPersonNameIsLoginStub(n))return;
    if(typeof window.kmLooksLikePersonName==='function'&&!window.kmLooksLikePersonName(n))return;
    const k=n.toLowerCase();
    if(seenArch[k])return;
    seenArch[k]=1;
    unused.push({
      name:n,
      rank:String(r.rank||'').trim(),
      rankSlot:String(r.rankSlot||'').trim(),
      unit:String(r.unit||'').trim(),
      post:String(r.position||'').trim(),
      code:String(r.code||'').trim()
    });
  });
  const used=Object.create(null);
  data.people.forEach(p=>{
    const n=kmPersonDisplayName(p);
    if(n)used[n.toLowerCase()]=1;
  });
  function takeMatch(p){
    const code=String((p&&(p.postCode||p.posCode||p.code))||'').trim();
    const rank=String((p&&p.rank)||'').trim();
    const unit=String((p&&p.unit)||'').trim();
    const post=String((p&&p.post)||'').trim();
    let idx=-1;
    if(code){
      idx=unused.findIndex(r=>r.code===code&&!used[r.name.toLowerCase()]);
    }
    if(idx<0&&rank&&unit){
      idx=unused.findIndex(r=>(r.rank===rank||r.rankSlot===rank)&&r.unit===unit&&(!post||r.post===post)&&!used[r.name.toLowerCase()]);
    }
    if(idx<0&&rank){
      idx=unused.findIndex(r=>(r.rank===rank||r.rankSlot===rank)&&!used[r.name.toLowerCase()]);
    }
    if(idx<0){
      idx=unused.findIndex(r=>!used[r.name.toLowerCase()]);
    }
    if(idx<0)return null;
    const hit=unused.splice(idx,1)[0];
    used[hit.name.toLowerCase()]=1;
    return hit;
  }
  let n=0;
  data.people.forEach(p=>{
    if(!p||p._kmVacantPosId)return;
    const cur=String(p.name||p.fullName||p.person||'').trim();
    const curOk=cur&&!kmPersonNameIsLoginStub(cur)&&(typeof kmLooksLikePersonName!=='function'||kmLooksLikePersonName(cur));
    if(curOk)return;
    const hit=takeMatch(p);
    if(!hit)return;
    const old=cur;
    if(cur&&typeof kmLooksLikeLegalOrderText==='function'&&kmLooksLikeLegalOrderText(cur)&&!String(p.posOrder||'').trim())p.posOrder=cur;
    p.name=hit.name;
    if(p.fullName&&kmPersonNameIsLoginStub(p.fullName))p.fullName=hit.name;
    if(p.person&&kmPersonNameIsLoginStub(p.person))p.person=hit.name;
    if(!String(p.rank||'').trim()&&hit.rank)p.rank=hit.rank;
    if(!String(p.rankSlot||'').trim()&&hit.rankSlot)p.rankSlot=hit.rankSlot;
    if(!String(p.unit||'').trim()&&hit.unit)p.unit=hit.unit;
    if(!String(p.post||'').trim()&&hit.post)p.post=hit.post;
    if(!String(p.postCode||p.posCode||'').trim()&&hit.code){
      p.postCode=hit.code;
      p.posCode=hit.code;
    }
    if(old&&old!==hit.name)kmRenamePersonInGraphs(old,hit.name);
    n++;
  });
  kmDropStubNamesFromGraphs();
  return n;
}

window.kmDutyArchivePersonnel=function(){ /* KM_DUTY_ARCHIVE_ONLY_V1 + KM_DUTY_CELLS_V1 - sole source: db.unitFormalArchives (object rows OR cells[] formal sheets). */
  var out=[], seen=Object.create(null);
  function add(name,unit,rank,extra){
    name=String(name||'').replace(/\s+/g,' ').trim();
    if(!name) return;
    if(typeof kmPersonNameIsLoginStub==='function' && kmPersonNameIsLoginStub(name)) return;
    if(typeof kmPersonNameIsVacantStub==='function' && kmPersonNameIsVacantStub(name)) return;
    if(typeof kmLooksLikePersonName==='function' && !kmLooksLikePersonName(name)) return;
    var k=name.toLowerCase();
    if(seen[k]) return;
    seen[k]=1;
    out.push(Object.assign({
      name:name,
      unit:String(unit||'').trim(),
      section:String(unit||'').trim(),
      rank:String(rank||'').trim()
    }, extra||{}));
  }
  function sectionLabel(r){
    if(!r) return '';
    if(Array.isArray(r.cells)){
      for(var i=0;i<r.cells.length;i++){
        var v=String(r.cells[i]||'').trim();
        if(v) return v;
      }
      return '';
    }
    return String(r.unit||r.section||r.name||r.title||'').trim();
  }
  function rowPerson(r, curUnit){
    if(!r) return null;
    if(r.type==='title' || r.type==='header') return null;
    if(r.type==='section') return {section:sectionLabel(r)};
    var cells=Array.isArray(r.cells)?r.cells:null;
    if(cells){
      while(cells.length<9) cells.push('');
      var n=String(cells[8]||'').replace(/\s+/g,' ').trim();
      if(!n) return null;
      var u=String(cells[0]||curUnit||'').trim();

        extra:{
          rankSlot:String(cells[6]||'').trim(),
          post:post,
          postCode:code,
          posCode:code,
          contact:'',
          phone:String(cells[13]||'').trim(),
          posOrder:String(cells[9]||'').trim(),
          education:'',
          specialty:String(cells[4]||'').trim()
        }
      };
    }
    var n2=String(r.sourceName||r.name||r.personName||'').replace(/\s+/g,' ').trim();
    if(!n2) return null;
    var code2=String(r.code||'').trim();
    return {
      name:n2,
      unit:String(r.unit||r.section||curUnit||'').trim(),
      rank:String(r.rank||r.rankSlot||'').trim(),
      extra:{
        rankSlot:r.rankSlot||'',
        post:r.position||'',
        postCode:code2,
        posCode:code2,
        contact:r.contact||'',
        phone:r.contact||r.phone||'',

        education:r.education||'',
        specialty:(typeof window.kmSpecialtyFromArchiveRow==='function')?window.kmSpecialtyFromArchiveRow(r,code2):String(r.vus||'').trim()
      }
    };
  }
  try{
    var d=(window.db||(typeof db!=='undefined'?db:null));
    var bags=d && d.unitFormalArchives;
    if(bags && typeof bags==='object'){
      Object.keys(bags).forEach(function(uid){
        var sheet=bags[uid];
        var rows=(sheet && sheet.rows) || [];
        var curUnit='';
        rows.forEach(function(r){
          var parsed=rowPerson(r, curUnit);
          if(!parsed) return;
          if(parsed.section!=null && parsed.name==null){ curUnit=parsed.section||curUnit; return; }
          if(parsed.unit) curUnit=parsed.unit;
          add(parsed.name, parsed.unit||curUnit, parsed.rank, parsed.extra);
        });
      });
    }
  }catch(e){ console.error('kmDutyArchivePersonnel',e); }
  return out;
};

function kmGraphBodyRowMm(personCount){
  const n=Math.max(1,Number(personCount)||1);
  const tableMm=Math.max(72,196-kmGraphChromeMm());

  if(n>=18)return Math.max(3,Math.round(h*100)/100);
  if(n>=12)return Math.max(3.5,Math.round(h*100)/100);
  if(n>=8)return Math.max(4,Math.min(7,Math.round(h*100)/100));

function kmPickPersonForDutyDay(people,day,lastDay,opts){
  opts=opts||{};
  const nameOf=typeof opts.nameOf==='function'?opts.nameOf:kmSchedulePersonKey;
  const unavailable=typeof opts.unavailable==='function'?opts.unavailable:()=>false;
  const minGap=Number.isFinite(+opts.minGap)?Math.max(1,+opts.minGap):kmMinDutyGap();
  const maxDuty=Number.isFinite(+opts.maxDuty)?Math.max(1,+opts.maxDuty):kmMaxDutyPerPerson();
  const list=kmSortPeopleByRank(people||[]);
  if(!list.length)return null;
  const dayNum=+day||1;
  const n=list.length;
  const pref=(dayNum-1)%n;
  let best=null,bestScore=null;
  for(let k=0;k<n;k++){
    const p=list[(pref+k)%n];
    if(!p||kmPersonNotPlannable(p))continue;
    const name=nameOf(p);
    if(!name)continue;
    if(unavailable(p,name,dayNum))continue;
    if(lastDay[name]!=null&&lastDay[name]<dayNum&&(dayNum-lastDay[name])<minGap)continue;
    const busy=typeof opts.busyDays==='function'?opts.busyDays(name):null;
    if(Array.isArray(busy)&&busy.some(x=>x!==dayNum&&Math.abs(x-dayNum)<minGap))continue;
    const load=Array.isArray(busy)?busy.length:0;
    if(load>=maxDuty)continue;
    const gapSince=lastDay[name]==null?1e9:(dayNum-lastDay[name]);
    const score=load*10000 + (k) - Math.min(gapSince,999)*0.001;
    if(bestScore==null||score<bestScore){bestScore=score;best=p;}
  }
  return best;
}

function kmSanitizeGraphPersonnel(scheduleObj){
  if(!scheduleObj||typeof scheduleObj!=='object')return;
  const usable=n=>typeof kmNameIsUsablePerson==='function'?kmNameIsUsablePerson(n):!!String(n||'').trim();
  if(Array.isArray(scheduleObj.selectedPeople)){
    scheduleObj.selectedPeople=scheduleObj.selectedPeople.map(n=>String(n||'').trim()).filter(usable);
  }else{
    scheduleObj.selectedPeople=[];
  }
  const keep=new Set(scheduleObj.selectedPeople);
  function pruneMap(map){
    if(!map||typeof map!=='object')return;
    Object.keys(map).forEach(k=>{
      const row=map[k];
      const occupied=row&&typeof row==='object'&&Object.keys(row).some(d=>String(row[d]==null?'':row[d]).trim());
      if(!usable(k) || (!keep.has(String(k).trim()) && !occupied)) delete map[k];
    });
  }
  pruneMap(scheduleObj.rows);
  pruneMap(scheduleObj.assignments);
}
function kmPruneCrossGraphPersonnelBleed(){
  const data=(window.db||db);
  if(!data||!data.dutyTypeSchedules||typeof data.dutyTypeSchedules!=='object')return;
  const keys=Object.keys(data.dutyTypeSchedules).filter(k=>{
    const sch=data.dutyTypeSchedules[k];
    return sch&&typeof sch==='object'&&Array.isArray(sch.selectedPeople);
  });
  const mainSel=((data.schedule&&data.schedule.selectedPeople)||[]).map(n=>String(n||'').trim()).filter(Boolean);
  const mainSet=new Set(mainSel);
  const mainKey=mainSel.slice().sort().join('\0');
  function rowBusy(row){
    return row&&typeof row==='object'&&Object.keys(row).some(d=>String(row[d]==null?'':row[d]).trim());
  }
  keys.forEach(k=>{
    const sch=data.dutyTypeSchedules[k];
    const sel=(sch.selectedPeople||[]).map(n=>String(n||'').trim()).filter(Boolean);
    const selKey=sel.slice().sort().join('\0');
    const copiedFromMain=!!mainKey&&selKey===mainKey;
    sch.selectedPeople=sel.filter(t=>{
      if(!t)return false;
      let busy=rowBusy((sch.assignments&&sch.assignments[t])||(sch.rows&&sch.rows[t]));
      if(!busy && sch.assignments){
        /* KM_DUTY_GRID_VISIBLE_V2 */
        const tl=String(t).toLowerCase();
        Object.keys(sch.assignments).some(function(k){
          const kl=String(k).toLowerCase();
          if(kl===tl || (tl && (kl.indexOf(tl)>=0 || tl.indexOf(kl)>=0))){ if(rowBusy(sch.assignments[k])){ busy=true; return true; } }
          return false;
        });
      }
      if(busy)return true;
      if(copiedFromMain)return false;
      return true;
    });
  });
  if(keys.length<2)return;
  const counts=Object.create(null);
  keys.forEach(k=>{
    (data.dutyTypeSchedules[k].selectedPeople||[]).forEach(n=>{
      const t=String(n||'').trim();
      if(t)counts[t]=(counts[t]||0)+1;
    });
  });
  const nGraphs=keys.length;
  keys.forEach(k=>{
    const sch=data.dutyTypeSchedules[k];
    sch.selectedPeople=(sch.selectedPeople||[]).filter(n=>{
      const t=String(n||'').trim();
      if(!t)return false;
      if((counts[t]||0)<nGraphs)return true;
      if(!mainSet.has(t))return true;
      return rowBusy((sch.assignments&&sch.assignments[t])||{});
    });
  });
}
function kmMigrateAllGraphPersonnel(){
  const data=(window.db||db);
  if(!data)return;
  kmPurgeVacantStubsFromGraphs();
  data.schedule=data.schedule||{};
  kmSanitizeGraphPersonnel(data.schedule);
  data.dutyTypeSchedules=data.dutyTypeSchedules||{};
  Object.keys(data.dutyTypeSchedules).forEach(k=>{
    const sch=data.dutyTypeSchedules[k];
    if(!sch||typeof sch!=='object')return;
    kmSanitizeGraphPersonnel(sch);
  });
  (data.futureSchedules||[]).forEach(fs=>{
    if(!fs||typeof fs!=='object')return;
    kmSanitizeGraphPersonnel(fs);
  });
  kmPruneCrossGraphPersonnelBleed();
}

    return `<label class="kmPeoplePickRow" data-km-i18n-skip${ineligible?' style="opacity:.65"':''}>

      <span class="kmPersonIdentity"><b>${esc(rank)}</b>${rank?' — ':''}${esc(name)}</span>
      <small>${esc(unit)}${ineligible?' · կոչումը չի թույլատրվում այս վերակարգում':''}</small>
    </label>`;
  }).join('');
}
function kmPeoplePickerRowsGrouped(all,selectedSet,prefix,dutyName){
  /* KM_PICKER_PERSIST_V3_GROUPED — show the full personnel list organized by subdivision,
     with a header per subdivision, instead of forcing one subdivision at a time. */
  const NO_UNIT='__km_no_unit__';
  const groups=new Map();
  (all||[]).forEach(p=>{
    const name=(typeof kmPickerPersonName==='function'?kmPickerPersonName(p):null)||(typeof kmPersonDisplayName==='function'?kmPersonDisplayName(p):null)||String((p&&p.name)||'');
    if(!name) return;
    const u=String((p&&(p.unit||p.section))||'').trim()||NO_UNIT;
    if(!groups.has(u)) groups.set(u,[]);
    groups.get(u).push(p);
  });
  const unitNames=[...groups.keys()].filter(u=>u!==NO_UNIT).sort((a,b)=>a.localeCompare(b,'hy'));
  if(groups.has(NO_UNIT)) unitNames.push(NO_UNIT);
  if(!unitNames.length) return '';
  return unitNames.map(u=>{
    const list=groups.get(u);
    const rowsHtml=kmPeoplePickerRows(list,selectedSet,prefix,dutyName);
    if(!rowsHtml) return '';
    const label=u===NO_UNIT?'Առանց ստորաբաժանման':u;
    let sel=0;
    list.forEach(p=>{
      const name=(typeof kmPickerPersonName==='function'?kmPickerPersonName(p):null)||(typeof kmPersonDisplayName==='function'?kmPersonDisplayName(p):null)||String((p&&p.name)||'');
      if(name&&selectedSet.has(name)) sel++;
    });
    return `<div class="kmPickGroupHead"><span>${esc(label)}</span><span class="muted">${sel}/${list.length}</span></div>${rowsHtml}`;
  }).join('');
}
function kmPersonnelUnitOptions(all){
  /* KM_PICKER_UNIT_OPTS_ALIGN_V1: options must use the SAME key as the grouping headers and
     the filter (unit || section). Building them from p.unit alone dropped every subunit stored
     only in p.section, so those people could be grouped but never selected/filtered. */
  const set=new Set();
  (all||[]).forEach(p=>{
    const u=String(p&&(p.unit||p.section)||'').trim();
    if(u) set.add(u);
  });
  return [...set].sort((a,b)=>a.localeCompare(b,'hy'));
}

  const unitOpts=['<option value="">Բոլոր ստորաբաժանումները</option>']

    <div class="kmPeoplePickActions">

      <button type="button" class="kmPickNone">Մաքրել երևացողները</button>

  `;
}
function kmBindPeoplePicker(dlg,all,selectedSet,prefix,dutyName){
  /* KM_PICKER_PERSIST_V2_BIND — unit filter + Ընտրել երևացողները REPLACES whole selection */
  if(!dlg) return selectedSet;
  const listEl=dlg.querySelector('.kmPeoplePickList');
  const searchEl=dlg.querySelector('.kmPickSearch');
  const unitEl=dlg.querySelector('.kmPickUnit');
  const countEl=dlg.querySelector('.kmPickCount');
  dlg._kmPickSelected=selectedSet;

  function updateCount(){
    if(countEl) countEl.textContent='Ընտրված՝ '+selectedSet.size;
  }
  function visibleBoxes(){
    return [...(listEl?listEl.querySelectorAll('input[data-km-pick-name]'):[])];
  }
  function personUnit(p){
    return String((p&& (p.unit||p.section))||'').trim();
  }
  function render(){
    if(!listEl) return;
    const q=String(searchEl&&searchEl.value||'').trim().toLocaleLowerCase('hy');
    const unit=String(unitEl&&unitEl.value||'').trim();
    const filtered=(all||[]).filter(p=>{
      const name=(typeof kmPickerPersonName==='function'?kmPickerPersonName(p):null)||(typeof kmPersonDisplayName==='function'?kmPersonDisplayName(p):null)||String((p&&p.name)||'');
      if(!name) return false;
      const u=personUnit(p);
      if(unit&&u!==unit) return false;
      if(!q) return true;
      const hay=[name,(typeof kmNormalizeRank==='function'?kmNormalizeRank(p.rank||p.rankSlot||''): (p.rank||'')),u].join(' ').toLocaleLowerCase('hy');
      return hay.includes(q);
    });
    if(!filtered.length){
      listEl.innerHTML='<div class="muted" style="padding:12px">Ոչինչ չգտնվեց այս ստորաբաժանումում / որոնումով</div>';
    }else{
      listEl.innerHTML=kmPeoplePickerRowsGrouped(filtered,selectedSet,prefix,dutyName);
    }
    visibleBoxes().forEach(cb=>{
      cb.addEventListener('change',()=>{
        const name=String(cb.getAttribute('data-km-pick-name')||'').trim();
        if(!name||(typeof kmPersonNameIsLoginStub==='function'&&kmPersonNameIsLoginStub(name)))return;
        if(cb.checked) selectedSet.add(name);
        else selectedSet.delete(name);
        updateCount();
      });
    });
    updateCount();
  }

  dlg.querySelector('.kmPickAll')?.addEventListener('click',e=>{
    e.preventDefault();
    // ADD currently visible (filtered) names to the selection.
    // Does NOT touch names already selected under a different subdivision/search filter.
    /* KM_PICKER_PERSIST_V3_ADD_VISIBLE — was: selectedSet.clear() before adding, which
       silently discarded people picked under a previously chosen subdivision. */
    visibleBoxes().forEach(cb=>{
      const name=String(cb.getAttribute('data-km-pick-name')||'').trim();
      if(!name||(typeof kmPersonNameIsLoginStub==='function'&&kmPersonNameIsLoginStub(name)))return;
      selectedSet.add(name);
      cb.checked=true;
    });
    updateCount();
  });
  dlg.querySelector('.kmPickNone')?.addEventListener('click',e=>{
    e.preventDefault();
    visibleBoxes().forEach(cb=>{
      const name=String(cb.getAttribute('data-km-pick-name')||'').trim();
      if(name) selectedSet.delete(name);
      cb.checked=false;
    });
    updateCount();
  });
  let t=null;
  searchEl?.addEventListener('input',()=>{
    clearTimeout(t);
    t=setTimeout(render,120);
  });
  unitEl?.addEventListener('change',()=>{
    // KM_PICKER_PERSIST_V3_KEEP_ON_UNIT_CHANGE — switching the subdivision filter must only
    // change which rows are VISIBLE; it must never erase names already checked under a
    // different subdivision. (Previously this called selectedSet.clear(), which is why marked
    // people from an earlier subdivision vanished the moment the user picked a new one and
    // then pressed Պահպանել.)
    render();
  });
  render();
  try{ (unitEl||searchEl)?.focus(); }catch(e){}
  return selectedSet;
}
function kmCommitPickerNames(dlg,selectedSet){
  const names=new Set(selectedSet||[]);
  try{
    (dlg?dlg.querySelectorAll('input[data-km-pick-name]:checked'):[]).forEach(cb=>{
      const n=String(cb.getAttribute('data-km-pick-name')||'').trim();
      if(n&&!kmPersonNameIsLoginStub(n)) names.add(n);
    });
  }catch(e){}
  return [...names].map(n=>String(n||'').trim()).filter(n=>n&&!kmPersonNameIsLoginStub(n)&&(typeof kmNameIsUsablePerson!=='function'||kmNameIsUsablePerson(n)));
}
function kmSeedPeopleFromRosterNames(names){
  const data=(window.db||(typeof db!=='undefined'?db:null));
  if(!data)return;
  data.people=Array.isArray(data.people)?data.people:[];
  let roster=[];
  try{ roster=(typeof window.kmPeopleRoster==='function'?window.kmPeopleRoster():[])||[]; }catch(e){ roster=[]; }
  const by=Object.create(null);
  roster.forEach(p=>{
    const n=String((p&&p.name)||'').trim();
    if(n) by[n.toLowerCase()]=p;
  });
  (names||[]).forEach(name=>{
    const n=String(name||'').trim();
    if(!n||kmPersonNameIsLoginStub(n))return;
    if(typeof kmNameIsUsablePerson==='function'&&!kmNameIsUsablePerson(n))return;
    if(data.people.some(p=>String((p&&p.name)||'').trim()===n))return;
    const r=by[n.toLowerCase()]||{name:n};
    data.people.push({
      name:n,
      rank:r.rank||'',
      rankSlot:r.rankSlot||'',
      unit:r.unit||'',
      post:r.post||'',
      postCode:r.postCode||r.code||'',
      posCode:r.posCode||r.postCode||r.code||''
    });
  });
}
function kmWirePickerButtons(dlg,selector){
  if(!dlg)return;
  dlg.querySelector('.kmPickAll')?.addEventListener('click',e=>{
    e.preventDefault();dlg.querySelectorAll(selector).forEach(x=>x.checked=true);
  });
  dlg.querySelector('.kmPickNone')?.addEventListener('click',e=>{
    e.preventDefault();dlg.querySelectorAll(selector).forEach(x=>x.checked=false);
  });
}
function kmFillPeoplePickerDialog(dlg,all,selected,prefix,dutyName){
  if(!dlg)return;
  const body=dlg.querySelector('#kmDlgBody');

function kmLoadDutyPickerPersonnel(dlg,all,selected,prefix,dutyName){
  /* KM_DUTY_ARCHIVE_ONLY_V1 — duty-type picker loader. Archive-only: if the archive hasn't
     finished loading yet, wait for it and re-read db.unitFormalArchives again; never falls
     back to kmPeopleRoster()/db.people like the shared kmLoadPickerPersonnel does. */
  if(all&&all.length){
    kmBindPeoplePicker(dlg,all,selected,prefix,dutyName);
    return;
  }
  const body=dlg.querySelector('#kmDlgBody');
  if(body){
    body.innerHTML='<p class="muted" style="padding:12px">Բեռնվում է զորամասի Արխիվից…</p>';
  }
  try{
    if(typeof window.kmEnsureHtmlV7UnitArchive==='function') window.kmEnsureHtmlV7UnitArchive({noPersist:true});
  }catch(e){}
  const go=(typeof window.kmEnsureUnitArchiveRows==='function')
    ? Promise.resolve(window.kmEnsureUnitArchiveRows())
    : Promise.resolve();
  Promise.resolve(go).then(function(){
    all.length=0;
    (window.kmDutyArchivePersonnel()||[]).forEach(p=>all.push(p));
    kmFillPeoplePickerDialog(dlg,all,selected,prefix,dutyName);
  }).catch(function(){
    kmFillPeoplePickerDialog(dlg,all,selected,prefix,dutyName);
  });
}
function kmLoadPickerPersonnel(dlg,all,selected,prefix,dutyName){
  if((!all||!all.length) && typeof window.kmPeopleRoster==='function'){
    try{
      const roster=window.kmPeopleRoster()||[];
      if(roster.length){
        all.length=0;
        roster.forEach(p=>all.push(p));
      }
    }catch(eR){}
  }
  if(all&&all.length){
    kmBindPeoplePicker(dlg,all,selected,prefix,dutyName);
    return;
  }
  const body=dlg.querySelector('#kmDlgBody');
  if(body){
    body.innerHTML='<p class="muted" style="padding:12px">Բեռնվում է զորամասի Excel արխիվից…</p>';
  }
  const go=(typeof window.kmEnsureArchivePersonnel==='function')
    ? window.kmEnsureArchivePersonnel()
    : Promise.resolve(kmAvailablePersonnel());
  Promise.resolve(go).then(function(list){
    all.length=0;
    (list||[]).forEach(p=>all.push(p));
    if(!all.length){
      try{ (kmAvailablePersonnel()||[]).forEach(p=>all.push(p)); }catch(eA){}
    }
    kmFillPeoplePickerDialog(dlg,all,selected,prefix,dutyName);
  }).catch(function(){
    kmFillPeoplePickerDialog(dlg,all,selected,prefix,dutyName);
  });
}
window.kmOpenMainPeoplePicker=function(){
  try{
    const data=(window.db||db);
    data.schedule=data.schedule||{};
    const all=((typeof window.kmGraphPickerPersonnel==='function'?window.kmGraphPickerPersonnel():null)||kmAvailablePersonnel()||[]); /* KM_ORINAK_GRAPH_V1_MAIN */
    const selected=new Set(
      Array.isArray(data.schedule.selectedPeople)
        ? data.schedule.selectedPeople.map(String).filter(n=>n&&!kmPersonNameIsLoginStub(n))
        : []
    );

    const dlg=window.kmOpenDialog(
      'Ընտրել անձնակազմ — '+String(data.schedule.name||'Հիմնական'),
      kmPeoplePickerShellHtml(all,selected,'km-main','Հիմնական'),
      async ()=>{
        const names=kmCommitPickerNames(dlg,selected);

        data.schedule.selectedPeople=names;
        data.schedule.rows=data.schedule.rows||{};
        data.schedule.selectedPeople.forEach(name=>{const p=kmResolvePersonByName(name);if(p)kmScheduleGetRow(data.schedule,p);});
        if(typeof save==='function')await save(true);
        schedule();

      },
      'Պահպանել'
    );

  }catch(e){
    console.error('kmOpenMainPeoplePicker',e);
    if(typeof toast==='function')toast('Անձնակազմի ընտրության պատուհանը բացել չհաջողվեց։ '+(e?.message||e),'error');
    return null;
  }
};

/* kmDutySelectedPeople is defined once above (KM_DUTY_FROM_ARCHIVE_ONLY_V2, archive-only). */

window.kmOpenDutyPeoplePicker=function(index){ /* KM_PICKER_PERSIST_V2_OPEN */
  try{
    const data=(window.db||db);
    const key='duty_'+Number(index);
    data.dutyTypeSchedules=data.dutyTypeSchedules||{};
    const sch=data.dutyTypeSchedules[key]||(data.dutyTypeSchedules[key]={assignments:{}});
    sch.assignments=sch.assignments||{};

    const all=(typeof window.kmDutyArchivePersonnel==='function'?window.kmDutyArchivePersonnel():[]); /* KM_DUTY_ARCHIVE_ONLY_V1 — archive only (db.unitFormalArchives), no db.people/kmPeopleRoster/kmAvailablePersonnel fallback */
    const typeName=String((data.dutyTypes||[])[index]||sch.name||'Վերակարգ');
    const max=Number(window.KM_GRAPH_MAX_PEOPLE)||5000;
    let initial=Array.isArray(sch.selectedPeople)
      ? sch.selectedPeople.map(String).filter(n=>n&&!(typeof kmPersonNameIsLoginStub==='function'&&kmPersonNameIsLoginStub(n)))
      : [];
    // Poisoned full-roster selection: start clean so Պահպանել cannot re-write thousands
    if(initial.length>max){
      initial=[];
      if(typeof toast==='function') toast('Այս գրաֆիկի անձնակազմի ցուցակը փչացած էր (չափազանց մեծ)։ Ցանկը մաքրվեց Ձեզ համար․ ընտրեք նորից և սեղմեք Պահպանել։','warn');
    }
    const selected=new Set(initial);

    const dlg=window.kmOpenDialog(
      'Ընտրել անձնակազմ — '+typeName,
      kmPeoplePickerShellHtml(all,selected,'km-duty',typeName),
      async ()=>{
        data.dutyTypeSchedules=data.dutyTypeSchedules||{};
        data.dutyTypeSchedules[key]=sch;
        const names=kmCommitPickerNames(dlg,selected);
        if(names.length>max){
          if(typeof toast==='function') toast('Առավելագույնը '+max+' անձ։ Հիմա՝ '+names.length+'։ Կրճատեք ցանկը։','error');
          return false;
        }
        /* KM_DUTY_ARCHIVE_ONLY_V1 — no longer seeds db.people from picks; selectedPeople stores
           plain archive names, resolved at render time purely from db.unitFormalArchives. */
        sch.selectedPeople=names.slice();
        sch.assignments=sch.assignments||{};
        // Drop assignments for people no longer selected
        Object.keys(sch.assignments).forEach(k=>{ if(!names.includes(k)) delete sch.assignments[k]; });
        names.forEach(name=>{sch.assignments[name]=sch.assignments[name]||{};});
        if(typeof save==='function')await save(true);
        if(typeof window.renderDutyTypePlanning==='function')window.renderDutyTypePlanning(Number(index));
        if(typeof toast==='function') toast('Անձնակազմը պահպանվեց՝ '+names.length+' անձ','ok');
        return true;
      },
      'Պահպանել'
    );

    kmLoadDutyPickerPersonnel(dlg,all,selected,'km-duty',typeName);
    return dlg;
  }catch(e){
    console.error('kmOpenDutyPeoplePicker',e);
    if(typeof toast==='function')toast('Անձնակազմի ընտրության պատուհանը բացել չհաջողվեց։ '+(e?.message||e),'error');
    return null;
  }
};

const KM_DOW_FULL=['Կիր','Երկ','Երք','Չրք','Հնգ','Ուրբ','Շբթ'];

function kmDayHeadCell(d,wd,wk,extraClass,year,month){
  const full=kmDow(wd,false);

function kmNormalizeGraphName(v,fallback){
  const s=String(v||'').replace(/\r\n/g,'\n').trim();
  return s||(fallback==null?'':String(fallback));
}
function kmGraphNameKey(name){
  return kmNormalizeGraphName(name,'').replace(/\s+/g,' ').toLocaleLowerCase();
}
function kmGraphNameOnly(name,fallback){
  const fb=fallback==null?'Հիմնական':String(fallback);
  let n=kmNormalizeGraphName(name,'');
  if(!n)return fb;
  const lines=n.split('\n').map(line=>line.replace(/\s+գրաֆիկ\s*$/i,'').trim()).filter(line=>line&&!/^գրաֆիկ$/i.test(line));
  return lines.join('\n')||fb;
}
function kmGraphDisplayTitle(name,fallback){
  const nameOnly=kmGraphNameOnly(name,fallback);

  archiveCurrentSchedule('Մինչև գրաֆիկի վերակառուցում');

function kmApplyTwoPassDutyPlan(people,days,opts){
  opts=opts||{};
  const nameOf=typeof opts.nameOf==='function'?opts.nameOf:kmSchedulePersonKey;
  const unavailable=typeof opts.unavailable==='function'?opts.unavailable:()=>false;
  const setDuty=opts.setDuty;
  const hasDuty=opts.hasDuty;
  const busyDays=opts.busyDays;
  const lastDay={};
  const dutyCount={};
  const minGap=kmMinDutyGap();
  const maxDuty=Number.isFinite(+opts.maxDuty)?Math.max(1,+opts.maxDuty):kmMaxDutyPerPerson();
  const pickOpts={nameOf,unavailable,busyDays,minGap,maxDuty};
  people=kmSortPeopleByRank(people||[]);
  const n=people.length;
  people.forEach(p=>{const nm=nameOf(p);if(nm)dutyCount[nm]=0;});

  function canTake(p,d){
    if(!p||kmPersonNotPlannable(p))return false;
    const name=nameOf(p);
    if(!name||unavailable(p,name,d))return false;
    if((dutyCount[name]||0)>=maxDuty)return false;
    if(lastDay[name]!=null&&lastDay[name]<d&&(d-lastDay[name])<minGap)return false;
    return true;
  }

  /* Pass 1: even stride — day d prefers person (d-1)%n (rank-sorted). */
  for(let d=1;d<=days;d++){
    if(!n)break;
    let chosen=null;
    const pref=(d-1)%n;
    for(let k=0;k<n;k++){
      const p=people[(pref+k)%n];
      if(canTake(p,d)){chosen=p;break;}
    }
    if(!chosen)continue;
    const name=nameOf(chosen);
    setDuty(name,d);
    lastDay[name]=d;
    dutyCount[name]=(dutyCount[name]||0)+1;
  }

  const unassigned=[];
  let assigned=0;
  for(let d=1;d<=days;d++){
    if(people.some(p=>hasDuty(nameOf(p),d))){assigned++;continue;}
    const chosen=kmPickPersonForDutyDay(people,d,lastDay,pickOpts);
    if(chosen){
      const name=nameOf(chosen);
      setDuty(name,d);
      lastDay[name]=d;
      dutyCount[name]=(dutyCount[name]||0)+1;
      assigned++;
    }else{
      unassigned.push(d);
    }
  }
  return {assigned,unassigned,days,dutyCount,maxDuty};
}
function kmApplyAutoPlanToSchedule(s,people){
  const y=+s.year,m=+s.month;
  const days=new Date(y,m,0).getDate();
  s.rows={};
  (people||[]).forEach(p=>{kmScheduleGetRow(s,p);});
  return kmApplyTwoPassDutyPlan(people,days,{
    nameOf:kmSchedulePersonKey,
    unavailable:(p,name,day)=>{
      if(typeof kmPersonHasInconvenientDay==='function'?kmPersonHasInconvenientDay(p,day):((p.bad||[]).map(Number).includes(day)))return true;
      if(typeof kmPersonEligibleForDuty==='function'&&!kmPersonEligibleForDuty(p,'Հիմնական'))return true;
      if(typeof kmSkipHolidaysInPlan==='function'&&kmSkipHolidaysInPlan()&&typeof kmIsArmenianHoliday==='function'&&kmIsArmenianHoliday(y,m,day))return true;
      return typeof isPersonOnVacation==='function'&&isPersonOnVacation(name,new Date(y,m-1,day,12,0,0));
    },
    busyDays:name=>kmPersonDutyDayList(s.rows[name]),
    setDuty:(name,day)=>{s.rows[name]=s.rows[name]||{};s.rows[name][day]='Հերթապահ';},
    hasDuty:(name,day)=>!!String((s.rows[name]||{})[day]||'').trim()
  });
}

async function autoPlan(){
  const graphPeople=kmMainSelectedPeople();
  if(!graphPeople.length){toast('Նախ ընտրեք անձնակազմ։','error');return;}
  const planningPeople=graphPeople.filter(p=>!kmPersonNotPlannable(p)&&(typeof kmPersonEligibleForDuty!=='function'||kmPersonEligibleForDuty(p,'Հիմնական')));
  if(!planningPeople.length){toast('Ընտրված անձնակազմը արգելափակված է կամ կոչումը չի թույլատրվում այս գրաֆիկում։','error');return;}

  const s=db.schedule;
  const days=new Date(+s.year,+s.month,0).getDate();
  if(!days||days<28||days>31){toast('Ամիս/տարի տվյալները սխալ են։','error');return;}

  archiveCurrentSchedule('Մինչև ավտոմատ պլանավորում');
  const result=kmApplyAutoPlanToSchedule(s,planningPeople);
  /* Արգելափակված իրական անձինք՝ դատարկ տող; թափուր stub՝ երբեք գրաֆիկում */
  graphPeople.filter(p=>kmPersonIsBlocked(p)&&!kmPersonIsVacantStub(p)).forEach(p=>{kmScheduleGetRow(s,p);});
  Object.keys(s.rows||{}).forEach(k=>{if(kmPersonNameIsVacantStub(k))delete s.rows[k];});

  await save();
  archiveCurrentSchedule('Ավտոմատ պլանավորված գրաֆիկ');
  render();

  const msg=result.unassigned.length
    ? `Պլանավորումն ավարտվեց։ Նշանակված օրեր՝ ${result.assigned}։ Առանց թեկնածուի օրեր՝ ${result.unassigned.join(', ')} (առավելագույնը ${typeof kmMaxDutyPerPerson==='function'?kmMaxDutyPerPerson():5} անգամ/անձ)։`
    : `Պլանավորումն ավարտվեց։ Բոլոր ${result.assigned} օրերը նշանակված են (առավելագույնը ${typeof kmMaxDutyPerPerson==='function'?kmMaxDutyPerPerson():5} անգամ/անձ)։`;
  toast(msg,result.unassigned.length?'warn':'');
}

function kmPersonDutyDayList(row){
  if(!row||typeof row!=='object')return [];
  return Object.keys(row).filter(d=>String(row[d]||'').trim()).map(Number).filter(n=>n>=1&&n<=31);
}

async function kmRebalancePlanForVacations(opts){
  opts=opts||{};
  const s=db&&db.schedule;
  if(!s)return {moved:0};
  const y=+s.year,m=+s.month;
  const days=new Date(y,m,0).getDate();
  if(!days)return {moved:0};
  s.rows=s.rows||{};
  const people=(typeof kmMainPlanningPeople==='function'?kmMainPlanningPeople():[]).filter(p=>!kmPersonNotPlannable(p));
  const nameOf=kmSchedulePersonKey;
  let cleared=0,moved=0;

  // Միայն արձակուրդի օրերի հերթապահությունները մաքրել — ոչ թե ամբողջ գրաֆիկը։
  Object.keys(s.rows).forEach(name=>{
    const row=s.rows[name];
    if(!row||typeof row!=='object')return;
    Object.keys(row).forEach(d=>{
      const day=+d;
      if(!day||!String(row[d]||'').trim())return;
      if(typeof isPersonOnVacation==='function'&&isPersonOnVacation(name,new Date(y,m-1,day,12,0,0))){
        delete row[d];
        cleared++;
      }
    });
  });

  const occupied={};
  const lastDay={};
  Object.keys(s.rows).forEach(name=>{
    const busy=kmPersonDutyDayList(s.rows[name]);
    busy.forEach(day=>{occupied[day]=name;});
    if(busy.length)lastDay[name]=Math.max.apply(null,busy);
  });

  for(let d=1;d<=days;d++){
    if(occupied[d])continue;
    const chosen=kmPickPersonForDutyDay(people,d,lastDay,{
      nameOf,
      unavailable:(p,name,day)=>{
        if(typeof kmPersonHasInconvenientDay==='function'?kmPersonHasInconvenientDay(p,day):((p.bad||[]).map(Number).includes(day)))return true;
        if(typeof kmPersonEligibleForDuty==='function'&&!kmPersonEligibleForDuty(p,'Հիմնական'))return true;
        if(typeof kmSkipHolidaysInPlan==='function'&&kmSkipHolidaysInPlan()&&typeof kmIsArmenianHoliday==='function'&&kmIsArmenianHoliday(y,m,day))return true;
        return typeof isPersonOnVacation==='function'&&isPersonOnVacation(name,new Date(y,m-1,day,12,0,0));
      },
      busyDays:name=>kmPersonDutyDayList(s.rows[name])
    });
    if(!chosen)continue;
    const name=nameOf(chosen);
    s.rows[name]=s.rows[name]||{};
    s.rows[name][d]='Հերթապահ';
    lastDay[name]=d;
    occupied[d]=name;
    moved++;
  }

  let dutyMoved=0;
  if(typeof kmRebalanceDutyPlansForVacations==='function'){
    try{dutyMoved=await kmRebalanceDutyPlansForVacations()||0;}catch(e){console.error(e);}
  }

  if(typeof save==='function')await save(true);
  if(typeof page!=='undefined'&&page==='schedule'&&typeof render==='function')render();
  if(!opts.silent){
    const total=cleared+moved+dutyMoved;
    toast(total?`Արձակուրդ նշվեց։ Մաքրվեց ${cleared} օր, նոր նշանակվեց ${moved}։`:'Արձակուրդը պահպանվեց։');
  }
  return {moved,cleared,dutyMoved};
}

function checkSchedule(){
  const s=db.schedule;
  const seen={},issues=[],warnings=[];
  const maxDay=new Date(+s.year,+s.month,0).getDate();

  kmMainSelectedPeople().forEach(person=>{
    const ds=kmScheduleGetRow(s,person);
    const personDays=Object.keys(ds).filter(d=>String(ds[d]||'').trim()).map(Number).sort((a,b)=>a-b);

    for(let i=1;i<personDays.length;i++){
      if(personDays[i]-personDays[i-1]<kmMinDutyGap())
        issues.push(`${person.name}: ${personDays[i-1]} և ${personDays[i]} կողք-կողքի են — նույն անձը ${kmMinDutyGap()} օրից շուտ չի կարող պլանավորվել։`);
    }
    const maxDuty=typeof kmMaxDutyPerPerson==='function'?kmMaxDutyPerPerson():5;
    if(personDays.length>maxDuty)
      issues.push(`${person.name}: ընդգրկված է ${personDays.length} անգամ — առավելագույնը ${maxDuty}։`);

    for(const day of personDays){
      if(day<1||day>maxDay){issues.push(`${person.name}: սխալ օր՝ ${day}`);continue;}
      if(typeof kmPersonHasInconvenientDay==='function'?kmPersonHasInconvenientDay(person,day):((person.bad||[]).map(Number).includes(day)))
        issues.push(`${person.name}: ${day}-ը նշված է որպես անհարմար օր։`);
      if(typeof isPersonOnVacation==='function' &&
         isPersonOnVacation(person.name,new Date(+s.year,+s.month-1,day,12,0,0)))
        issues.push(`${person.name}: ${day}-ին արձակուրդում է։`);

      if(seen[day])issues.push(`Օր ${day}: միաժամանակ ${seen[day]} և ${person.name}`);
      else seen[day]=person.name;
    }
  });

}

function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='KM_database_backup.json';a.click();toast('Բազայի JSON պահուստը պատրաստ է')}

function restore(){
  if(typeof kmCanAdmin==='function'&&!kmCanAdmin()){toast('Միայն ադմինիստրատոր');return;}
  let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{
    const data=JSON.parse(r.result);
    if(!data||typeof data!=='object')throw new Error('Սխալ JSON');
    if(typeof kmApplyDbSnapshot==='function'){if(!kmApplyDbSnapshot(data))return;}
    else{Object.keys(db).forEach(k=>delete db[k]);Object.assign(db,data);}
    if(typeof normalize==='function')normalize();
    save(true);render();toast('Վերականգնվեց');
  }catch(e){alert(e&&e.message?e.message:'Սխալ JSON')}};r.readAsText(f)};i.click();
}
function validate(){
  let issues=[];
  const names=(db.people||[]).map(p=>String(p.name||'').trim()).filter(Boolean);
  if(names.some((n,i)=>names.indexOf(n)!==i))issues.push('Կրկնվող անձ');
  const sheets=Array.isArray(db.spreadsheets)?db.spreadsheets:(Array.isArray(db.tables)?db.tables:[]);
  sheets.forEach((t,i)=>{
    const headers=Array.isArray(t.headers)?t.headers:(Array.isArray(t.cols)?t.cols:null);
    const rows=Array.isArray(t.rows)?t.rows:[];
    if(headers&&!headers.length)issues.push('Աղյուսակ '+(i+1)+'՝ դատարկ սյունակ');
    if(headers&&headers.length&&rows.some(r=>Array.isArray(r)&&r.length!==headers.length))issues.push('Աղյուսակ '+(i+1)+'՝ չափերի սխալ');
  });
  if(!(db.dutyTypes||[]).length)issues.push('Վերակարգերի տեսակ չկա');
  alert(issues.length?'Գտնված խնդիրներ:\n'+issues.join('\n'):'Բոլոր ստուգումները հաջող են');
}

(function(){

    if(!Array.isArray(db.vacations)) db.vacations=[];
    return db.vacations;
  };
  function kmLocalYMD(dateObj){
    const d=dateObj instanceof Date?dateObj:new Date(dateObj);
    if(!(d instanceof Date)||isNaN(+d))return '';
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  window.kmVacationSamePerson=function(stored, personName){
    const a=String(stored||'').trim();
    const b=String(personName||'').trim();
    if(!a||!b)return false;
    if(a===b)return true;
    try{ return a.toLowerCase()===b.toLowerCase(); }
    catch(e){ return a.toLowerCase()===b.toLowerCase(); }
  };
  function kmVacationSamePerson(stored, personName){
    return window.kmVacationSamePerson(stored, personName);
  }

      return !!window.kmPersonAbsence(personName, dateObj);

    const ds=kmLocalYMD(dateObj);
