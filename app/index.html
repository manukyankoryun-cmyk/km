<script id="KM-macrolab-ansi-unicode-v1">
(function(){
  'use strict';

  var A2U = {};
 var ANSI_FONT='Times Armenian';
 var UNICODE_FONT='GHEA Grapalat';
 function targetFont(){return direction()==='u2a'?ANSI_FONT:UNICODE_FONT;}
 function sourceFont(){return direction()==='u2a'?UNICODE_FONT:ANSI_FONT;}
  function put(hex,ch){A2U[String.fromCharCode(parseInt(hex,16))]=ch;}

  put('A0','\u00A0'); put('A1','\u058E'); put('A2','և'); put('A3','։');
  put('A4',')'); put('A5','('); put('A6','»'); put('A7','«'); put('A8','—');
  put('A9','.'); put('AA','՝'); put('AB',','); put('AC','-'); put('AD','֊');
  put('AE','…'); put('AF','՜'); put('B0','՛'); put('B1','՞');

  var caps='ԱԲԳԴԵԶԷԸԹԺԻԼԽԾԿՀՁՂՃՄՅՆՇՈՉՊՋՌՍՎՏՐՑՒՓՔՕՖ';
  var lows='աբգդեզէըթժիլխծկհձղճմյնշոչպջռսվտրցւփքօֆ';
  for(var i=0;i<caps.length;i++){
    put((0xB2+i*2).toString(16),caps[i]);
    put((0xB3+i*2).toString(16),lows[i]);
  }
  put('FE','՚');

  var U2A={};
  Object.keys(A2U).forEach(function(k){
    var u=A2U[k];
    if(!Object.prototype.hasOwnProperty.call(U2A,u))U2A[u]=k;
  });

  function ansiToUnicode(s){
    return Array.from(String(s==null?'':s)).map(function(ch){return Object.prototype.hasOwnProperty.call(A2U,ch)?A2U[ch]:ch;}).join('');
  }
  function unicodeToAnsi(s){
    return Array.from(String(s==null?'':s)).map(function(ch){return Object.prototype.hasOwnProperty.call(U2A,ch)?U2A[ch]:ch;}).join('');
  }

  window.macroLabAnsiToUnicode=ansiToUnicode;
  window.macroLabUnicodeToAnsi=unicodeToAnsi;

  function status(msg,type){
    var el=document.getElementById('macroLabStatus');
    if(!el)return;
    if(typeof kmTranslateUI==='function')msg=kmTranslateUI(msg);
    el.textContent=msg;
    el.className='converterStatus'+(type?' '+type:'');
  }

  function setMacroLabBusy(msg){
    if(typeof window.kmSetMacroLabBusy==='function'){window.kmSetMacroLabBusy(msg);return;}
    var bar=document.getElementById('macroLabResultActions');
    if(bar)bar.style.display='none';
    status(msg,'busy');
  }

  function direction(){
    return document.querySelector('input[name="mlDirection"]:checked')?.value||'a2u';
  }
  function scope(){
    return document.querySelector('input[name="mlScope"]:checked')?.value||'all';
  }
  function convertText(s){
    return direction()==='u2a'?unicodeToAnsi(s):ansiToUnicode(s);
  }
  function selectedText(){
    return document.getElementById('mlSelectedText')?.value||'';
  }

  function applyScope(s,state){
    s=String(s==null?'':s);
    if(scope()==='all')return convertText(s);
    if(state.done)return s;
    var needle=selectedText();
    if(!needle)return s;
    var idx=s.indexOf(needle);
    if(idx<0)return s;
    state.done=true;
    return s.slice(0,idx)+convertText(needle)+s.slice(idx+needle.length);
  }

  window.updateMacroLabScope=function(){
    var wrap=document.getElementById('mlSelectedWrap');
    if(wrap)wrap.style.display=scope()==='selected'?'block':'none';
  };

  window.resetMacroLab=function(){
    var f=document.getElementById('macroLabFile'); if(f)f.value='';
    var t=document.getElementById('mlSelectedText'); if(t)t.value='';
    var a=document.querySelector('input[name="mlDirection"][value="a2u"]');if(a)a.checked=true;
    var b=document.querySelector('input[name="mlScope"][value="all"]');if(b)b.checked=true;
    updateMacroLabScope();
    var bar=document.getElementById('macroLabResultActions');if(bar)bar.style.display='none';
    status('Պատրաստ է։','');
  };

  function stem(name){return String(name||'file').replace(/\.[^.]+$/,'')||'file';}
  function ext(name){var m=/\.([^.]+)$/.exec(String(name||''));return m?m[1].toLowerCase():'';}

  function loadLib(src,globalName){
    return new Promise(function(resolve,reject){
      if(globalName&&window[globalName]){resolve(window[globalName]);return;}
      var found=document.querySelector('script[data-ml-lib="'+src+'"]');
      if(found){
        found.addEventListener('load',function(){resolve(globalName?window[globalName]:true);},{once:true});
        found.addEventListener('error',function(){reject(new Error('Գրադարանը չի բեռնվել։'));},{once:true});
        return;
      }
      var s=document.createElement('script');s.src=src;s.async=true;s.dataset.mlLib=src;
      s.onload=function(){resolve(globalName?window[globalName]:true);};
      s.onerror=function(){reject(new Error('Չհաջողվեց բեռնել անհրաժեշտ գրադարանը։ Ստուգիր ինտերնետ կապը։'));};
      document.head.appendChild(s);
    });
  }

  var CDN={jszip:'vendor/jszip.min.js'};

  async function docx(file){
  await loadLib(CDN.jszip,'JSZip');
  var zip=await JSZip.loadAsync(await file.arrayBuffer());
  var targets=Object.keys(zip.files).filter(function(n){
    return /^word\/(document|header\d*|footer\d*|footnotes|endnotes|comments)\.xml$/i.test(n);
  });
  var st={done:false};
  var convertedRuns=0;

  for(var i=0;i<targets.length;i++){
    var n=targets[i],xml=await zip.file(n).async('string');
    var dom=new DOMParser().parseFromString(xml,'application/xml');
    var nodes=dom.getElementsByTagNameNS('*','t');

    for(var j=0;j<nodes.length;j++){
      var before=nodes[j].textContent||'';
      var after=applyScope(before,st);
      nodes[j].textContent=after;

      if(after!==before || scope()==='all'){
        var run=nodes[j].parentNode;
        while(run && run.nodeType===1 && run.localName!=='r')run=run.parentNode;
        if(run && run.localName==='r'){
          var ns='http'+':'+'/'+'/schemas.openxmlformats.org/wordprocessingml/2006/main';
          var rPr=null;
          for(var c=0;c<run.childNodes.length;c++){
            if(run.childNodes[c].nodeType===1 && run.childNodes[c].localName==='rPr'){rPr=run.childNodes[c];break;}
          }
          if(!rPr){
            rPr=dom.createElementNS(ns,'w:rPr');
            run.insertBefore(rPr,run.firstChild);
          }
          var rFonts=null;
          for(var c2=0;c2<rPr.childNodes.length;c2++){
            if(rPr.childNodes[c2].nodeType===1 && rPr.childNodes[c2].localName==='rFonts'){rFonts=rPr.childNodes[c2];break;}
          }
          if(!rFonts){
            rFonts=dom.createElementNS(ns,'w:rFonts');
            rPr.insertBefore(rFonts,rPr.firstChild);
          }
          var font=targetFont();
          ['ascii','hAnsi','eastAsia','cs'].forEach(function(a){
            rFonts.setAttributeNS(ns,'w:'+a,font);
          });
          convertedRuns++;
        }
      }
    }
    zip.file(n,new XMLSerializer().serializeToString(dom));
  }

  if(scope()==='selected'&&!st.done)throw new Error('Նշված հատվածը Word ֆայլում չի գտնվել մեկ ամբողջական տեքստային հատվածի մեջ։');

  if(zip.file('word/styles.xml')){
    var styles=await zip.file('word/styles.xml').async('string');
    var sdom=new DOMParser().parseFromString(styles,'application/xml');
    var ns2='http'+':'+'/'+'/schemas.openxmlformats.org/wordprocessingml/2006/main';
    var defs=sdom.getElementsByTagNameNS('*','rFonts');
    var font2=targetFont();
    for(var k=0;k<defs.length;k++){
      ['ascii','hAnsi','eastAsia','cs'].forEach(function(a){
        if((defs[k].getAttributeNS(ns2,a)||'')===sourceFont() || k===0){
          defs[k].setAttributeNS(ns2,'w:'+a,font2);
        }
      });
    }
    zip.file('word/styles.xml',new XMLSerializer().serializeToString(sdom));
  }

  var blob=await zip.generateAsync({
    type:'blob',
    mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  });
  var outName=stem(file.name)+'_'+Date.now().toString().slice(0,13)+(direction()==='u2a'?'_Times_Armenian_ANSI':'_GHEA_Grapalat_Unicode')+'.docx';
  if(typeof window.kmSaveBlobToDesktop==='function'){
    return window.kmSaveBlobToDesktop(blob,outName);
  }
  if(window.kmNative&&window.kmNative.file&&window.kmNative.file.writeDesktop){
    var bytes=new Uint8Array(await blob.arrayBuffer());
    var wr=await window.kmNative.file.writeDesktop({name:outName,bytes:bytes});
    if(!wr||!wr.ok||!wr.path)throw new Error('Desktop-ում պահպանել չհաջողվեց։');
    return {ok:true,output:wr.path,folder:wr.folder,size:wr.size||bytes.length,convertedRuns:convertedRuns};
  }
  throw new Error('Desktop-ում պահպանելու համակարգը հասանելի չէ։');
}

window.runMacroLabConversion=async function(){
  try{
    var input=document.getElementById('macroLabFile'),file=input&&input.files&&input.files[0];
    if(!file)throw new Error('Նախ ընտրիր Word, Excel կամ PDF ֆայլը։');
    if(scope()==='selected'&&!selectedText())throw new Error('Մուտքագրիր ընտրված հատվածը։');
    setMacroLabBusy('Փոխակերպումը կատարվում է…');
    var e=ext(file.name);
    var r;
    if(e==='docx'){
      r=await docx(file);
      status('Փոխակերպումն ավարտված է։ Տառատեսակ՝ '+targetFont()+'.','ok');
    }else if(e==='doc'||e==='xlsx'||e==='xls'||e==='pdf'){
      var map=direction()==='u2a'?U2A:A2U;
      r=await window.kmNativeMacroRequest({mode:'macroLab',direction:direction(),scope:scope(),selected:selectedText(),map:map,sourceFont:sourceFont(),targetFont:targetFont()},file);
    }else throw new Error('Աջակցվում են .doc, .docx, .xlsx/.xls և .pdf ֆայլերը։');
    if(typeof window.kmShowMacroLabResult==='function'){window.kmShowMacroLabResult(r);}
    else{
      status('Պատրաստ է՝ '+(r.output||''),'ok');
      var bar=document.getElementById('macroLabResultActions');if(bar&&r.output)bar.style.display='flex';
    }
  }catch(e){console.error('Macro Lab conversion',e);status(e.message||'Փոխակերպման սխալ։','error')}
};

 try{

   if(round!==probe)status('ANSI/Unicode mapping ինքնաստուգումը ձախողվեց։','error');

<script id="km-original-manager-script">
(function(){
  'use strict';
  let originalRoot='';
  let lastOriginalResult=null;
  function el(id){return document.getElementById(id)}
  function setStatus(msg,type){let x=el('originalStatus');if(!x)return;if(typeof kmTranslateUI==='function')msg=kmTranslateUI(msg);x.textContent=msg;x.className='converterStatus'+(type?' '+type:'')}
  function showResult(r){
    lastOriginalResult=r||null;
    let box=el('originalSummary');if(!box)return;
    if(!r){box.innerHTML='';return}
    const supported=Number(r.supported!=null?r.supported:r.total)||0;
    box.innerHTML=`
    <div class="originalMetric"><b>${supported.toLocaleString()}</b> աջակցվող ֆայլ</div>
    <div class="originalMetric"><b>${Number(r.duplicates||0).toLocaleString()}</b> կրկնօրինակ</div>
    <div class="originalMetric"><b>${Number(r.broken||0).toLocaleString()}</b> չբացվող</div>
    <div class="originalMetric"><b>${formatBytes(r.duplicateBytes||0)}</b> կրկնօրինակների ծավալ</div>
    ${Number(r.contentDuplicates||0)>0?`<div class="originalMetric"><b>${Number(r.contentDuplicates).toLocaleString()}</b> տարբեր անուն, նույն բովանդակություն</div>`:''}
    ${r.repaired!=null?`<div class="originalMetric"><b>${Number(r.repaired).toLocaleString()}</b> վերականգնված</div>`:''}
    ${r.unrepairable!=null?`<div class="originalMetric"><b>${Number(r.unrepairable).toLocaleString()}</b> չվերականգնված</div>`:''}
    ${r.moved!=null?`<div class="originalMetric"><b>${Number(r.moved).toLocaleString()}</b> տեղափոխված կրկնօրինակ</div>`:''}
    ${r.limitReached?`<div class="originalMetric" style="grid-column:1/-1;color:#a43b3b"><b>⚠</b> Դուրս է 200,000 ֆайлի սահմանից</div>`:''}
    ${r.reportPath?`<div class="originalMetric" style="grid-column:1/-1;text-align:left;font-size:12px;word-break:break-all"><b>Հաշվետվություն</b><br>${escapeOriginal(r.reportPath)}</div>`:''}`;
  }
  function formatBytes(n){n=Number(n)||0;for(const u of ['B','KB','MB','GB','TB']){if(Math.abs(n)<1024)return n.toFixed(u==='B'?0:1)+' '+u;n/=1024}return n.toFixed(1)+' PB'}
  function escapeOriginal(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  async function api(path,body){
  if(!window.kmNative||!window.kmNative.original){
    throw new Error('Native KM համակարգը հասանելի չէ։');
  }
  if(path==='/api/original/select-folder') return await window.kmNative.original.selectFolder();
  if(path==='/api/original/analyze') return await window.kmNative.original.analyze(body&&body.root);
  if(path==='/api/original/clean') return await window.kmNative.original.clean(body&&body.root);
  if(path==='/api/original/repair') return await window.kmNative.original.repair(body&&body.root);
  throw new Error('Անհայտ native գործողություն։');
}
  function nativeAvailable(){return !!(window.kmNative&&window.kmNative.original);}
  window.originalSelectFolder=async function(){try{if(!nativeAvailable())throw new Error('Այս ֆունկցիան աշխատում է KM Setup տարբերակում։');setStatus('Պանակի ընտրություն…','busy');let r=await api('/api/original/select-folder',{});if(!r.path){setStatus('Պանակ չի ընտրվել։','');return}originalRoot=r.path;let p=el('originalFolder');if(p)p.textContent=originalRoot;showResult(null);setStatus('Պանակը ընտրված է։ Սեղմիր «Վերլուծել»։','ok')}catch(e){console.error(e);setStatus(e.message,'error')}};
  window.originalAnalyze=async function(){try{if(!originalRoot)throw new Error('Նախ ընտրիր պանակը։');setStatus('Վերլուծվում են ֆայլերը։ Մեծ պանակի դեպքում սա կարող է տևել մի քանի րոպե…','busy');let r=await api('/api/original/analyze',{root:originalRoot});showResult(r);const lim=r.limitReached?' (սահման 200k)':'';setStatus(`Վերլուծումն ավարտված է․ ${r.duplicates||0} կրկնօրինակ, ${r.broken||0} չբացվող${lim}։`,'ok')}catch(e){console.error(e);setStatus(e.message,'error')}};
  window.originalCleanDuplicates=async function(){try{if(!originalRoot)throw new Error('Նախ ընտրիր և վերլուծիր պանակը։');if(!confirm('Կրկնօրինակները կհեռացվեն իրենց ներկայիս տեղերից և կտեղափոխվեն _KM_Duplicates_Trash պանակ։ Շարունակե՞լ։'))return;setStatus('Կրկնօրինակները տեղափոխվում են…','busy');let r=await api('/api/original/clean',{root:originalRoot});showResult(r);setStatus(`Ավարտված է․ տեղափոխվել է ${r.moved||0} կրկնօրինակ։`,'ok')}catch(e){console.error(e);setStatus(e.message,'error')}};
  window.originalRepairBroken=async function(){try{if(!originalRoot)throw new Error('Նախ ընտրիր և վերլուծիր պանակը։');setStatus('Փորձ է կատարվում վերականգնել չբացվող ֆայլերը…','busy');let r=await api('/api/original/repair',{root:originalRoot});showResult(r);setStatus(`Վերականգնման փորձն ավարտված է․ հաջող՝ ${r.repaired||0}, չվերականգնված՝ ${r.unrepairable||0}։`,'ok')}catch(e){console.error(e);setStatus(e.message,'error')}};
  async function sha(file){let b=await file.arrayBuffer();let h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
  async function browserValid(f){let e=(f.name.split('.').pop()||'').toLowerCase();let b=new Uint8Array(await f.slice(0,16).arrayBuffer());if(e==='pdf')return String.fromCharCode(...b.slice(0,5))==='%PDF-';if(e==='docx'||e==='xlsx')return b[0]===0x50&&b[1]===0x4b;if(e==='doc'||e==='xls')return b.length>=8&&[0xD0,0xCF,0x11,0xE0,0xA1,0xB1,0x1A,0xE1].every((v,i)=>b[i]===v);return false}
  window.originalAnalyzeFallback=async function(){try{let files=Array.from(el('originalFilesFallback')?.files||[]);if(!files.length)throw new Error('Ընտրիր ֆայլերը։');if(files.length>200000)throw new Error('Առավելագույնը 200,000 ֆայլ։');setStatus('Browser-ային նախնական ստուգում…','busy');let groups=new Map(),broken=0;for(let i=0;i<files.length;i++){let f=files[i],k=f.name.toLowerCase()+'|'+f.size;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(f);try{if(!(await browserValid(f)))broken++}catch(_){broken++}if(i%100===0)await new Promise(r=>setTimeout(r,0))}let dup=0,bytes=0;for(const arr of groups.values()){if(arr.length<2)continue;let hs=new Map();for(const f of arr){let h=await sha(f);if(!hs.has(h))hs.set(h,[]);hs.get(h).push(f)}for(const a of hs.values())if(a.length>1){dup+=a.length-1;bytes+=a.slice(1).reduce((s,f)=>s+f.size,0)}}showResult({supported:files.length,duplicates:dup,broken,duplicateBytes:bytes});setStatus('Browser-ային ստուգումն ավարտված է։ Տեղական ֆայլերը չեն փոփոխվել։','ok')}catch(e){console.error(e);setStatus(e.message,'error')}};
})();
</script>

<script id="km-v55-i18n">

 Object.assign(RU_MAP,{"2. Վերլուծել":"2. Анализировать","4. Ուղղել չբացվողները":"4. Исправить неоткрывающиеся","Standalone KM-ը չի կարող կարդալ Word/Excel ծրագրի կենդանի selection-ը, ուստի այստեղ նշվում է փոխակերպվող հատվածը։":"Standalone KM не может прочитать текущее выделение Word/Excel, поэтому здесь указывается преобразуемый фрагмент.","Անվտանգության համար կրկնօրինակները տեղափոխվում են _KM_Duplicates_Trash, ոչ թե անմիջապես ոչնչացվում։":"Для безопасности дубликаты перемещаются в _KM_Duplicates_Trash, а не удаляются безвозвратно.","Գործառույթը կառուցված է Macro Lab-ի տրամաբանությամբ․ ընտրիր փոխակերպման ուղղությունը և ծավալը, ապա բեռնի՛ր Word (.docx), Excel (.xlsx/.xls) կամ PDF ֆայլը։":"Функция работает по логике Macro Lab: выберите направление и объём преобразования, затем загрузите Word (.docx), Excel (.xlsx/.xls) или PDF.","Եթե KM-ը բացված է առանց Setup-ի":"Если KM открыт без Setup","Ընթացիկ գրաֆիկ":"Текущий график","Ընտրիր այն օրերը, որոնց տվյալ անձը չի կարող հերթապահել։":"Выберите дни, когда этот человек не может дежурить.","Ծրագիր՝":"Программа:","Վճար՝":"Оплата:","Ծրագիրը վճարովի է":"Программа платная","Լիցենզիա (1 տարի)՝":"Лицензия (1 год):","48 000 ՀՀ դրամ":"48 000 драм","Ծրագիրը պատրաստող՝":"Разработчик:","Կարող ես ստեղծել և խմբագրել մինչև 100 վերակարգի անվանում։ Դատարկ դաշտերը չեն պահպանվի։":"Можно создать и редактировать до 100 названий нарядов. Пустые поля не сохраняются.","Կհեռացվի նաև ընտրված տեսակի առանձին պլանավորումը։":"Отдельное планирование выбранного вида также будет удалено.","Համեմատվում է նույն ֆայլի անունը + չափը + SHA-256 բովանդակությունը։":"Сравниваются имя файла + размер + SHA-256 содержимого.","Յուրաքանչյուր արխիվ պահում է ամբողջ տվյալների բազան՝ անձնակազմ, անհարմար օրեր, ընթացիկ գրաֆիկ և գրանցումներ։ Պահպանման ժամկետը՝ 3 տարի։":"Каждый архив хранит всю базу: личный состав, неудобные дни, текущий график и регистрации. Срок хранения — 3 года.","Նոր անուն":"Новое имя","Պանակ ընտրված չէ։":"Папка не выбрана.","Պանակ չի ընտրվել։":"Папка не выбрана.","Պանակի ընտրություն…":"Выбор папки…","Վերականգնված պատճենները գրվում են _KM_Repaired պանակում։ Սկզբնական վնասված ֆայլը չի վերագրվում։":"Восстановленные копии сохраняются в папке _KM_Repaired. Исходный повреждённый файл не перезаписывается.","Վերակարգ":"Наряд","Տվյալները պահպանվում են իրական IndexedDB բազայում՝ KMDatabase։":"Данные хранятся в реальной базе IndexedDB — KMDatabase.","Փորձել վերականգնել":"Попробовать восстановить","աջակցվող ֆայլ":"поддерживаемый файл","Գրաֆիկի պահպանում":"Сохранение графика","Բոլոր տվյալները պահպանվում են KMDatabase IndexedDB բազայում։ Ընթացիկ արխիվը պահպանում է ամբողջ աշխատանքային վիճակը՝ անձնակազմ, անհարմար օրեր, գրաֆիկ և գրանցումներ։":"Все данные хранятся в IndexedDB KMDatabase. Текущий архив сохраняет всё рабочее состояние: личный состав, неудобные дни, график и регистрации.","Անձնակազմ բաժնում ավելացված բոլոր անձինք այստեղ լրացվում են ավտոմատ։ «Նշում» դաշտը սկզբում ապաակտիվացված է։ Արձակուրդ նշանակելու համար ակտիվացրու նշումը և ընտրիր սկիզբ/ավարտ ամսաթվերը։":"Все лица из раздела личного состава добавляются сюда автоматически. Поле «Отметка» изначально отключено. Чтобы назначить отпуск, включите отметку и выберите даты начала/окончания.","Մուտքագրեք ամբողջ անունը":"Введите полное имя","Մուտքագրիր ընտրված հատվածը։":"Введите выбранный фрагмент.","Մուտքագրիր այն հատվածը, որը պետք է փոխակերպվի":"Введите фрагмент для преобразования","Հեռացնել կրկնօրինակները՝ թողնելով բնօրինակը":"Удалить дубликаты, оставив оригинал","Փնտրել կրկնօրինակներ և չբացվող ֆայլեր":"Найти дубликаты и неоткрывающиеся файлы","Ստուգել ընտրված ֆայլերը":"Проверить выбранные файлы","Ստուգել տվյալները":"Проверить данные","Ընտրել Word / Excel / PDF պանակը":"Выбрать папку Word / Excel / PDF","Word / Excel / PDF ֆայլ":"Файл Word / Excel / PDF","Հեռացնել դատարկ տողերը (Excel)":"Удалить пустые строки (Excel)","Մաքրել տեքստի/բջիջների եզրային բացատները":"Удалить пробелы по краям текста/ячеек","Փոխակերպումները կատարվում են բրաուզերում։ Word-ի համար օգտագործիր .docx ֆայլ։ PDF → Word փոխակերպման դեպքում վերականգնվում է հիմնականում տեքստային բովանդակությունը, իսկ բարդ ձևավորումը կարող է ամբողջությամբ չպահպանվել։":"Преобразования выполняются в браузере. Для Word используйте .docx. При PDF → Word в основном восстанавливается текст; сложное форматирование может сохраниться не полностью.","Standalone browser ռեժիմը չի կարող ջնջել կամ վերանորոգել համակարգչի տեղական ֆայլերը։ Կարող ես ընտրել մինչև 200,000 ֆայլ և կատարել միայն կրկնօրինակների browser-ային նախնական ստուգում։":"Standalone browser-режим не может удалять или восстанавливать локальные файлы. Можно выбрать до 200 000 файлов только для предварительной проверки дубликатов.","Browser-ային ստուգումն ավարտված է։ Տեղական ֆայլերը չեն փոփոխվել։":"Проверка в браузере завершена. Локальные файлы не изменены.","Վերակարգերի տեսակներ բաժինը բացելու ժամանակ սխալ առաջացավ։":"Ошибка при открытии раздела видов нарядов.","Վերակարգի պլանավորումը բացելու ժամանակ սխալ առաջացավ։":"Ошибка при открытии планирования нарядов.","Վերակարգերի տեսակները պահպանելու ժամանակ սխալ առաջացավ։":"Ошибка при сохранении видов нарядов.","Արխիվը մաքրելու ժամանակ սխալ առաջացավ։":"Ошибка при очистке архива.","Բջիջը պահպանելու ժամանակ սխալ առաջացավ։":"Ошибка при сохранении ячейки.","Ընթացիկ գրաֆիկ/բազա":"Текущий график/база","Ավտոմատ պլանավորված գրաֆիկ":"Автоматически спланированный график","Մինչև ավտոմատ պլանավորում":"Перед автопланированием","Մինչև գրաֆիկի մաքրում":"Перед очисткой графика"});

<script id="km-10090-all-graph-font-size">
(function(){
  const KEY='KM_GRAPH_FONT_SIZE_10090';
  const MIN=8,MAX=20,DEFAULT=10;
  function clamp(value){
    const n=Math.round(Number(value)||DEFAULT);
    return Math.max(MIN,Math.min(MAX,n));
  }
  function get(){return clamp(localStorage.getItem(KEY)||DEFAULT)}
  function apply(value){
    const size=clamp(value);
    localStorage.setItem(KEY,String(size));
    document.documentElement.dataset.kmGlobalFont=String(size);
    document.documentElement.style.setProperty('--km-graph-font-size',size+'pt');
    document.documentElement.style.setProperty('--km-app-font-size',size+'pt');
    document.documentElement.classList.toggle('km-custom-font',size!==DEFAULT);
    document.querySelectorAll('.kmGraphFontSizeSelect').forEach(select=>{select.value=String(size)});
    return size;
  }
  function makeControl(){
    const label=document.createElement('label');
    label.className='kmGraphFontControl';
    label.innerHTML='<span>Տառաչափ</span><select class="kmGraphFontSizeSelect" aria-label="Ծրագրի ընդհանուր տառաչափ">'+
      Array.from({length:MAX-MIN+1},(_,i)=>MIN+i).map(n=>'<option value="'+n+'">'+n+'</option>').join('')+
      '</select>';
    const select=label.querySelector('select');
    select.value=String(get());
    select.addEventListener('change',()=>apply(select.value));
    return label;
  }
  function install(){
    const host=document.querySelector('.top .toolbar');
    if(host && !host.querySelector('.kmGraphFontControl'))host.appendChild(makeControl());
  }
  window.kmGetGraphFontSize=get;
  window.kmSetGraphFontSize=apply;
  apply(get());
  document.addEventListener('DOMContentLoaded',install);
  // The toolbar persists across page changes; no document-wide observer is necessary.
  if(document.readyState!=='loading')install();
})();
</script>

<script id="km-10089-print-keyboard-shortcuts">
(function(){
  function visible(el){
    if(!el || el.disabled)return false;
    const style=getComputedStyle(el);
    return style.display!=='none' && style.visibility!=='hidden' && el.getClientRects().length>0;
  }

  function openCurrentGraphPrint(){
    const dutyButton=document.getElementById('dutyPrintBtn');
    if(visible(dutyButton)){
      dutyButton.click();
      return true;
    }
    const mainButton=[...document.querySelectorAll('button')].find(button=>
      visible(button) && button.getAttribute('onclick')==='printScheduleTable()'
    );
    if(mainButton){
      mainButton.click();
      return true;
    }
    if(typeof window.printScheduleTable==='function'){
      window.printScheduleTable();
      return true;
    }
    return false;
  }

  document.addEventListener('keydown',event=>{
    if(event.key!=='Enter' || event.ctrlKey || event.metaKey || event.altKey || event.shiftKey)return;

    const dialog=document.getElementById('kmCoreDialog');
    const dialogPrint=dialog?.querySelector('#kmDlgSave');
    if(visible(dialogPrint) && !!dialog?.querySelector('#kmNativePrinter')){
      event.preventDefault();
      event.stopPropagation();
      dialogPrint.click();

    }

    const previewPrint=document.querySelector('#kmPrintPreview #kmPPPrint');
    if(visible(previewPrint)){
      event.preventDefault();
      event.stopPropagation();
      previewPrint.click();
    }
  },true);
})();
</script>

<script id="km-v76-responsive-js">
(function(){
 function kmFitPreview(){
  try{
   const host=document.getElementById('kmPrintPreview');
   if(!host)return;
   const paper=host.querySelector('.kmPrintPaper');
   if(!paper)return;
   paper.style.transform=''; paper.style.marginBottom='';
   if(window.matchMedia('print').matches)return;
   const available=Math.max(320,host.clientWidth-24);
   const natural=paper.scrollWidth||paper.offsetWidth||1;
   if(natural>available){
    const scale=Math.max(.55,Math.min(1,available/natural));
    paper.style.transform=`scale(${scale})`;
    paper.style.transformOrigin='top center';
    paper.style.marginBottom=`-${paper.offsetHeight*(1-scale)}px`;
   }
  }catch(e){console.error('kmFitPreview',e)}
 }
 window.kmFitPreview=kmFitPreview;
 window.addEventListener('resize',()=>requestAnimationFrame(kmFitPreview));
 window.addEventListener('orientationchange',()=>setTimeout(kmFitPreview,120));
 document.addEventListener('DOMContentLoaded',()=>{
  setTimeout(kmFitPreview,50);
  let previewObs=null;
  function attachPreviewFit(){
    const host=document.getElementById('kmPrintPreview');
    if(host){
      if(!previewObs){
        previewObs=new MutationObserver(()=>setTimeout(kmFitPreview,30));
        previewObs.observe(host,{childList:true,subtree:true});
      }
      kmFitPreview();
      return;
    }
    if(previewObs){previewObs.disconnect();previewObs=null;}
  }
  new MutationObserver(attachPreviewFit).observe(document.body,{childList:true});
 });
})();
</script>
